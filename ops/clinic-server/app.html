<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="robots" content="noindex">
<title>Clinic Desk</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#F2F4F7;color:#101828;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
a{color:#175CD3}
.wrap{max-width:520px;margin:0 auto;min-height:100vh;background:#F2F4F7;display:flex;flex-direction:column;position:relative}
.white{background:#FFFFFF}
.top{background:#FFF;padding:calc(env(safe-area-inset-top) + 16px) 16px 12px;border-bottom:1px solid #EAECF0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.h1{font-size:22px;font-weight:700;letter-spacing:-.2px}
.sub{font-size:13px;color:#667085}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;border-radius:16px;padding:6px 10px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.card{background:#FFF;border:1px solid #EAECF0;border-radius:14px}
.sec{padding:14px 16px 6px;font-size:13px;font-weight:600;color:#475467;display:flex;justify-content:space-between}
.row{display:flex;align-items:center;gap:12px;padding:11px 12px;border-bottom:1px solid #F2F4F7}
.row:last-child{border-bottom:none}
.btn{height:48px;border-radius:12px;border:1px solid #D0D5DD;background:#FFF;font-size:15px;font-weight:600;color:#344054;padding:0 14px}
.btn.pri{background:#175CD3;border-color:#175CD3;color:#FFF}
.btn.big{height:60px;font-size:17px;font-weight:700;width:100%}
.btn.sm{height:36px;font-size:13px;border-radius:8px;padding:0 12px}
.btn:disabled{opacity:.45;cursor:default}
.content{flex:1;padding-bottom:96px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#FFF;border-top:1px solid #EAECF0;padding:8px 0 calc(env(safe-area-inset-bottom) + 10px)}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid}
nav.tabs button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:500;color:#667085;position:relative;padding:4px 0}
nav.tabs button.on{color:#175CD3;font-weight:600}
.badge{position:absolute;top:-2px;left:55%;min-width:18px;height:18px;border-radius:9px;background:#D92D20;color:#FFF;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 4px}
.toast{margin:10px 12px 0;padding:10px 12px;border-radius:12px;background:#101828;color:#FFF;font-size:13px;line-height:1.45}
.sheet-bg{position:fixed;inset:0;background:rgba(16,24,40,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:#FFF;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom) + 24px);display:flex;flex-direction:column;gap:12px}
.grab{align-self:center;width:36px;height:4px;border-radius:2px;background:#D0D5DD}
input.f{height:48px;border:1px solid #D0D5DD;border-radius:10px;padding:0 12px;font-size:16px;font-family:inherit;width:100%}
.seg{display:grid;background:#F2F4F7;border-radius:10px;padding:3px}
.seg button{height:34px;border:none;border-radius:8px;font-size:13px;font-weight:600;background:transparent;color:#667085}
.seg button.on{background:#FFF;color:#101828;box-shadow:0 1px 2px rgba(16,24,40,.1)}
.empty{padding:28px 16px;text-align:center;color:#667085;font-size:14px}
.tok{font-variant-numeric:tabular-nums}
.fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:96px;height:52px;padding:0 18px;border-radius:16px;border:none;background:#101828;color:#FFF;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;box-shadow:0 6px 16px rgba(16,24,40,.25);z-index:5}
.bub{max-width:80%;padding:8px 12px;border-radius:14px;font-size:15px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
.err{margin:12px;padding:12px;border-radius:12px;background:#FEF3F2;color:#B42318;font-size:14px}

/* ---- v6: iOS-style staff app ---- */
.wrap.i{background:#F2F2F7;color:#000;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.i .content{padding-bottom:110px}
.ihd{padding:calc(env(safe-area-inset-top) + 18px) 16px 4px 20px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.ilt{margin:0;font-size:34px;font-weight:700;letter-spacing:.3px;line-height:1.1}
.icirc{width:34px;height:34px;border-radius:17px;border:none;background:#E3E3E8;color:#0A63D6;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ipill{height:32px;padding:0 12px;border-radius:16px;border:none;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap}
.ipill:disabled{cursor:default;opacity:1}
.icard{background:#FFF;border-radius:16px}
.itile{padding:12px;display:flex;flex-direction:column;font-family:inherit;color:#000}
.itile .tok{font-size:24px;font-weight:600}
.isec{padding:22px 32px 7px;display:flex;justify-content:space-between;gap:10px;font-size:13px;color:#6C6C70}
.ilist{margin:0 16px;background:#FFF;border-radius:12px;overflow:hidden}
.irow{width:100%;display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:48px;border:none;border-bottom:1px solid #E5E5EA;background:#FFF;color:#000;font-size:17px;text-align:left;text-decoration:none;font-family:inherit;box-sizing:border-box}
.irow:last-child{border-bottom:none}
button.irow:active,a.irow:active{background:#E5E5EA}
.icol{flex-grow:1;display:flex;flex-direction:column;min-width:0}
.isub{font-size:13px;color:#6C6C70}
.ifoot{padding:7px 32px 0;font-size:13px;color:#6C6C70;line-height:1.4}
.ib{width:100%;height:54px;border-radius:14px;border:none;background:#FFF;color:#0A63D6;font-size:17px;font-family:inherit;display:flex;align-items:center;justify-content:center;margin-top:8px}
.ib.pri{background:#0A63D6;color:#FFF;font-weight:600;margin-top:0}
.ib.soft{background:#EAF2FD;font-weight:600;height:44px;font-size:15px;margin:0}
.ib:disabled{opacity:.4;cursor:default}
.igray{height:34px;padding:0 14px;border-radius:17px;border:none;background:#EFEFF4;color:#000;font-size:15px;flex-shrink:0}
.ichip{height:34px;padding:0 14px;border-radius:17px;border:1px solid #D1D1D6;background:#FFF;color:#000;font-size:15px}
.ichip.on{background:#0A63D6;border-color:#0A63D6;color:#FFF}
.iseg{display:grid;background:#E3E3E8;border-radius:9px;padding:2px;gap:2px}
.iseg button{height:32px;border:none;border-radius:7px;background:transparent;font-size:14px;color:#000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.iseg button.on{background:#FFF;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.isheet .iseg{background:#EFEFF4}
.iround{width:36px;height:36px;border-radius:18px;background:#EAF2FD;color:#0A63D6;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ilink{border:none;background:none;color:#0A63D6;font-size:17px;padding:4px 0;font-family:inherit}
.iback{border:none;background:none;color:#0A63D6;font-size:17px;display:flex;align-items:center;gap:4px;padding:8px;font-family:inherit}
.iact{height:58px;border-radius:12px;border:none;background:#FFF;color:#0A63D6;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;font-family:inherit}
.isearch{height:38px;border-radius:10px;background:#E3E3E8;display:flex;align-items:center;gap:8px;padding:0 10px;color:#6C6C70}
.isearch input{border:none;outline:none;background:transparent;font:inherit;font-size:17px;flex-grow:1;min-width:0;color:#000}
.ifield{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #E5E5EA;font-size:17px}
.ifield span{width:64px;flex-shrink:0}
.ifield input{border:none;outline:none;font:inherit;flex-grow:1;min-width:0;background:transparent}
.i textarea{width:100%;box-sizing:border-box;border:none;outline:none;resize:vertical;font:inherit;font-size:17px;line-height:1.35;padding:8px 0;min-height:64px}
.itabs{position:fixed;bottom:0;left:0;right:0;background:rgba(249,249,249,.94);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid #D1D1D6;padding:7px 0 calc(env(safe-area-inset-bottom) + 8px);z-index:6}
.itabs .in{max-width:520px;margin:0 auto;display:grid}
.itabs button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;color:#6C6C70;position:relative;padding:2px 0;font-family:inherit}
.itabs button.on{color:#0A63D6}
.itabs .badge{background:#D70015;left:56%}
.itoast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 84px);max-width:340px;background:rgba(28,28,30,.92);color:#FFF;font-size:15px;padding:11px 16px;border-radius:14px;z-index:8;text-align:center}
.isheetbg{position:fixed;inset:0;background:rgba(0,0,0,.28);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.isheet{background:#F2F2F7;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:12px 12px 0 0;padding:6px 16px calc(env(safe-area-inset-bottom) + 24px);box-sizing:border-box;display:flex;flex-direction:column}
.isheet .grab{background:#C4C4C7;width:36px;height:5px;border-radius:3px;align-self:center}
.ishead{display:flex;justify-content:space-between;align-items:center;padding-top:10px}
</style>
</head>
<body>
<div id="app"></div>
<script>/*QRLIB*/</script>
<script>
(function () {
  var API = location.origin + (location.hostname.indexOf('desk.') === 0 ? '/api' : '/webhook/desk-api');
  var qs = new URLSearchParams(location.search);
  var $app = document.getElementById('app');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function post(b) { return fetch(API, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(b) }).then(function (r) { return r.json(); }); }
  function store(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function qrSvg(text, px) {
    try { var q = qrcode(0, 'M'); q.addData(text); q.make(); var n = q.getModuleCount(), c = px / (n + 8), r = '';
      for (var y = 0; y < n; y++) for (var x = 0; x < n; x++) if (q.isDark(y, x)) r += '<rect x="' + ((x + 4) * c).toFixed(2) + '" y="' + ((y + 4) * c).toFixed(2) + '" width="' + (c + .3).toFixed(2) + '" height="' + (c + .3).toFixed(2) + '"/>';
      return '<svg width="' + px + '" height="' + px + '" viewBox="0 0 ' + px + ' ' + px + '" role="img" aria-label="QR code"><rect width="100%" height="100%" fill="#fff"/><g fill="#101828">' + r + '</g></svg>';
    } catch (e) { return '<div style="font-size:12px">' + esc(text) + '</div>'; }
  }
  var DOC = { in: ['In clinic', '#12B76A', '#ECFDF3', '#067647'], late: ['Running late', '#F79009', '#FFFAEB', '#B54708'], away: ['Away', '#F04438', '#FEF3F2', '#B42318'], leave: ['On leave', '#98A2B3', '#F2F4F7', '#344054'] };
  function docPill(d) { var k = DOC[d && d.status] ? d.status : 'in'; var lab = k === 'late' ? 'Late ' + d.mins + ' min' : k === 'away' ? 'Away' + (d.until ? ' till ' + d.until : '') : DOC[k][0];
    return '<span class="pill" style="background:' + DOC[k][2] + ';color:' + DOC[k][3] + '"><span class="dot" style="background:' + DOC[k][1] + '"></span>' + esc(lab) + '</span>'; }

  // ---------------- patient live tracker ----------------
  function tracker(k) {
    var st = { d: null };
    function draw() {
      var d = st.d;
      if (!d) { $app.innerHTML = '<div class="wrap white"><div class="empty">Loading…</div></div>'; return; }
      if (!d.ok) { $app.innerHTML = '<div class="wrap white"><div style="padding:60px 24px;text-align:center"><div style="font-size:20px;font-weight:700">Ye token ab active nahi hai</div><div class="sub" style="margin-top:8px">Naya token lene ke liye clinic ka QR scan karein.</div></div></div>'; return; }
      var en = d.lang === 'en';
      var a = d.ahead, card;
      if (d.st === 's') card = [en ? "It's your turn" : 'Aapki baari aa gayi', en ? 'Please come in 🙏' : 'Andar aaiye 🙏', '#12B76A', '#FFFFFF'];
      else if (d.st === 'd') card = [en ? 'Visit done' : 'Aapka visit ho gaya', en ? 'Thank you for visiting' : 'Aane ke liye dhanyavaad', '#F2F4F7', '#101828'];
      else if (d.st === 'x') card = [en ? 'Token cancelled' : 'Token cancel ho gaya', '', '#F2F4F7', '#101828'];
      else if (a <= 1) card = [en ? 'You are next' : 'Aap agle hain', (en ? 'Please come to the waiting room · ' : 'Waiting room mein aa jaiye · ') + d.eta, '#EFF4FF', '#1849A9'];
      else if (a === 2) card = [en ? 'Please come near the clinic' : 'Clinic ke paas aa jaiye', (en ? '2 ahead · ' : '2 patients aapse pehle · ') + d.eta, '#FFFAEB', '#93370D'];
      else card = [d.eta, en ? 'Relax, there is still time' : 'Aaram se aaiye, abhi time hai', '#F2F4F7', '#101828'];
      var dots = ''; for (var i = 3; i >= 0; i--) dots += '<span style="flex:1;height:6px;border-radius:3px;background:' + (d.st === 's' ? '#12B76A' : (i >= Math.min(a, 3) ? '#175CD3' : '#EAECF0')) + '"></span>';
      var docNote = d.doc && d.doc.status !== 'in' ? '<div style="margin:14px 20px 0;padding:12px 14px;border-radius:12px;background:' + DOC[d.doc.status][2] + ';color:' + DOC[d.doc.status][3] + ';font-size:14px;line-height:1.5">' + esc(d.doc.line) + '</div>' : '';
      $app.innerHTML = '<div class="wrap white">' +
        '<div style="padding:calc(env(safe-area-inset-top) + 24px) 20px 0;display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:15px;font-weight:700">' + esc(d.clinic.name) + '</div><div class="sub">' + esc(d.clinic.doctor) + '</div></div><span style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#067647"><span class="dot" style="background:#12B76A"></span>Live</span></div>' +
        '<div style="margin:24px 20px 0;border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;align-items:center;gap:6px;background:' + card[2] + ';color:' + card[3] + '"><span style="font-size:14px;font-weight:600;opacity:.85">' + (en ? 'Your token' : 'Aapka token') + '</span><span class="tok" style="font-size:64px;font-weight:800;letter-spacing:-1.5px;line-height:1">' + esc(d.tok) + '</span><span style="font-size:18px;font-weight:700;margin-top:8px;text-align:center">' + esc(card[0]) + '</span><span style="font-size:14px;opacity:.85;text-align:center">' + esc(card[1]) + '</span></div>' +
        (d.st === 'w' ? '<div style="margin:20px 20px 0;display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="card" style="padding:12px 14px"><div class="sub">' + (en ? 'Now serving' : 'Abhi chal raha hai') + '</div><div class="tok" style="font-size:26px;font-weight:800">' + esc(d.now || '—') + '</div></div><div class="card" style="padding:12px 14px"><div class="sub">' + (en ? 'Ahead of you' : 'Aapse pehle') + '</div><div class="tok" style="font-size:26px;font-weight:800">' + a + '</div></div></div><div style="margin:18px 20px 0;display:flex;gap:6px">' + dots + '</div>' : '') +
        docNote +
        (d.st === 'w' ? '<div style="margin:18px 20px 0;padding:12px 14px;border-radius:12px;background:#F2F4F7;font-size:14px;line-height:1.5;color:#344054">' + (en ? 'We will message you on WhatsApp when 2 patients are ahead of you.' : 'Jab 2 patients aapse pehle honge, hum WhatsApp par bata denge. Tab tak aap bahar wait kar sakte hain.') + '</div>' : '') +
        '<div style="flex:1"></div>' +
        (d.st === 'w' ? '<div style="padding:16px 20px calc(env(safe-area-inset-bottom) + 24px)"><button class="btn" id="cx" style="width:100%;color:#B42318;border-color:#FDA29B">' + (en ? 'Cancel my token' : 'Token cancel karein') + '</button></div>' : '') +
        '</div>';
      var cx = document.getElementById('cx');
      if (cx) cx.onclick = function () { if (confirm(en ? 'Cancel your token?' : 'Token cancel karna hai?')) post({ action: 'track', k: k, cancel: true }).then(function (r) { st.d = r; draw(); }); };
    }
    function tick() { post({ action: 'track', k: k }).then(function (r) { st.d = r; draw(); }).catch(function () {}); }
    draw(); tick(); setInterval(tick, 12000);
  }

  // ---------------- waiting room TV ----------------
  function tv(k) {
    function draw(d) {
      if (!d || !d.ok) { $app.innerHTML = '<div style="padding:60px;font-size:24px">TV link is not valid.</div>'; return; }
      var dk = DOC[d.doc.status] ? d.doc.status : 'in';
      var next = d.next.map(function (t, i) { return '<div class="tok" style="font-size:7vh;font-weight:800;color:' + (i ? '#61646C' : '#FFF') + '">' + esc(t) + '</div>'; }).join('') || '<div style="font-size:4vh;color:#61646C">—</div>';
      $app.innerHTML = '<div style="height:100vh;background:#0C111D;color:#FFF;display:grid;grid-template-columns:1.6fr 1fr">' +
        '<div style="padding:6vh 5vw;display:flex;flex-direction:column;justify-content:space-between"><div style="display:flex;justify-content:space-between;align-items:center;gap:20px"><span style="font-size:3.2vh;font-weight:700">' + esc(d.clinic.name) + '</span><span style="display:flex;align-items:center;gap:10px;font-size:2.8vh;font-weight:600;color:' + (dk === 'in' ? '#75E0A7' : '#FEC84B') + '"><span class="dot" style="width:1.6vh;height:1.6vh;background:' + DOC[dk][1] + '"></span>' + esc(d.clinic.doctor) + ' · ' + esc(dk === 'away' && d.doc.until ? 'Back ~' + d.doc.until : DOC[dk][0]) + '</span></div>' +
        '<div><div style="font-size:3.6vh;font-weight:600;color:#94969C;letter-spacing:1px">NOW SERVING</div>' + (d.now ? '<div class="tok" style="font-size:26vh;font-weight:800;letter-spacing:-.5vh;line-height:.95">' + esc(d.now) + '</div>' : '<div style="font-size:7vh;font-weight:700;color:#CECFD2;margin:3vh 0">Shuru hone wala hai</div>') + '<div style="font-size:4.6vh;font-weight:600;color:#CECFD2">' + esc(d.cabin || '') + '</div></div>' +
        '<div style="font-size:2.6vh;color:#94969C">' + d.waiting + ' waiting · about ' + d.avg + ' min per patient</div></div>' +
        '<div style="background:#161B26;padding:6vh 3.5vw;display:flex;flex-direction:column;gap:2.6vh"><div style="font-size:3vh;font-weight:600;color:#94969C;letter-spacing:1px">NEXT</div>' + next + '<div style="flex:1"></div>' +
        '<div style="display:flex;align-items:center;gap:20px;background:#FFF;color:#101828;border-radius:20px;padding:16px">' + qrSvg(d.clinic.qr, Math.round(window.innerHeight * 0.24)) + '<div style="font-size:2.6vh;font-weight:700;line-height:1.3">Token chahiye?<br><span style="font-weight:500;color:#475467">Scan karein, WhatsApp par mil jayega</span></div></div></div></div>';
    }
    function tick() { post({ action: 'tv', k: k }).then(draw).catch(function () {}); }
    tick(); setInterval(tick, 8000);
  }

  // ---------------- printable QR poster ----------------
  function poster() {
    var n = qs.get('n') || '', c = qs.get('c') || 'Clinic';
    var link = 'https://wa.me/' + n + '?text=TOKEN';
    $app.innerHTML = '<div style="max-width:620px;margin:0 auto;background:#FFF;min-height:100vh;padding:48px 32px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px">' +
      '<div style="font-size:30px;font-weight:800">' + esc(c) + '</div><div style="font-size:26px;font-weight:700">Token ke liye scan karein</div><div style="font-size:18px;color:#475467">Line mein khade rehne ki zaroorat nahi.<br>WhatsApp par token aur live status milega.</div>' +
      qrSvg(link, 340) + '<ol style="text-align:left;font-size:17px;line-height:1.8;color:#344054"><li>Camera se QR scan karein</li><li>WhatsApp mein TOKEN bhejein</li><li>Baari aane se pehle message aayega</li></ol>' +
      '<button class="btn pri" onclick="window.print()" style="margin-top:8px">Print</button></div>';
  }

  // ---------------- staff app (v6) ----------------
  function staff() {
    var S = { sid: load('cd_sid'), role: load('cd_role'), d: null, appts: null, apptsAt: 0, tab: null, sheet: null, toast: '', toastT: 0,
      seg: 'calls', per: 'today', q: '', pk: null, busy: false, err: '' };
    var C = { blue: '#0A63D6', sec: '#6C6C70', ok: '#1E7A34', warn: '#C93400', bad: '#D70015' };
    function logout() { store('cd_sid', null); store('cd_role', null); S.sid = null; S.d = null; drawLogin(); }
    function drawLogin(msg) {
      var bn = load('cd_bot') || '15551823589';

        var fu = [[0, 'None'], [3, '3 days'], [7, '1 week'], [14, '2 weeks'], [30, '1 month']];
        inner = '<div class="ishead"><button class="ilink" data-close="1">Cancel</button><span style="font-size:17px;font-weight:600">Bill</span><span style="width:56px"></span></div>' +
          '<div style="padding:18px 4px 0;display:flex;flex-direction:column;gap:2px"><span style="font-size:28px;font-weight:700">' + esc(b.name) + '</span><span style="font-size:15px;color:' + C.sec + '">' + esc(b.tok) + ' · seen ' + esc(b.seen) + '</span></div>' +
          sec('Fee').replace('class="isec"', 'class="isec" style="padding-left:16px"') + '<div class="ilist" style="margin:0;padding:14px 16px;display:flex;flex-direction:column;gap:14px">' +
          '<label style="display:flex;align-items:baseline;gap:4px;font-size:40px;font-weight:600"><span style="color:' + C.sec + '">₹</span><input id="fee" class="tok" inputmode="numeric" value="' + esc(s.m === 'free' ? '0' : s.fee) + '" aria-label="Fee in rupees" style="border:none;outline:none;font:inherit;width:100%;padding:0;background:transparent"' + (s.m === 'free' ? ' disabled' : '') + '></label>' +
          seg([['cash', 'Cash'], ['upi', 'UPI'], ['free', 'No charge']], s.m, 'data-m') +
          (s.m === 'upi' && S.d.upi ? (s.qr ? '<div style="display:flex;flex-direction:column;align-items:center;gap:6px">' + qrSvg('upi://pay?pa=' + encodeURIComponent(S.d.upi.id) + '&pn=' + encodeURIComponent(S.d.upi.name) + '&am=' + encodeURIComponent(s.fee) + '&cu=INR', 220) + '<span class="isub">' + esc(S.d.upi.id) + '</span></div>' : '<button class="ib soft" data-upiqr="1">Show clinic UPI QR</button>') : '') + '</div>' +
          sec('Follow-up').replace('class="isec"', 'class="isec" style="padding-left:16px"') + '<div class="ilist" style="margin:0;padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px">' + fu.map(function (f) { return '<button class="ichip' + (s.fup === f[0] ? ' on' : '') + '" data-fup="' + f[0] + '">' + f[1] + '</button>'; }).join('') + '</div>' +
          '<div class="ifoot" style="padding-left:16px">' + (s.fup ? 'WhatsApp reminder goes the evening before.' : 'No reminder.') + '</div>' +
          '<button class="ib pri" id="savebill" style="margin-top:18px">Save · ' + (s.m === 'free' ? 'No charge' : rupee(s.fee) + ' ' + (s.m === 'upi' ? 'UPI' : 'Cash')) + '</button>';
      } else if (s.t === 'add') {
        inner = '<div class="ishead"><button class="ilink" data-close="1">Cancel</button><span style="font-size:17px;font-weight:600">Walk-in</span><span style="width:56px"></span></div>' +
          '<div class="ilist" style="margin:18px 0 0"><label class="ifield"><span>Name</span><input id="wn" autocomplete="off" value="' + esc(s.name || '') + '"></label><label class="ifield" style="border:none"><span>Phone</span><input id="wp" inputmode="tel" placeholder="Optional" value="' + esc(s.phone || '') + '"></label></div>' +
          '<div class="ifoot" style="padding-left:16px">With a phone number, they get the token and live status on WhatsApp.</div>' +
          '<button class="ib pri" id="addtok" style="margin-top:18px">Give token</button>';
      } else if (s.t === 'rm') {
        inner = '<div style="padding:16px 4px 4px;text-align:center;font-size:15px;color:' + C.sec + '">' + esc(s.name) + '</div><button class="ib" style="color:' + C.bad + '" id="rmtok">Remove from queue</button><button class="ib" data-close="1" style="font-weight:600">Cancel</button>';
      } else if (s.t === 'status') {
        var dc = S.d.doc; var k = s.st || dc.status;
        inner = '<div class="ishead"><button class="ilink" data-close="1">Cancel</button><span style="font-size:17px;font-weight:600">Doctor status</span><span style="width:56px"></span></div><div style="margin-top:16px">' + seg([['in', 'In'], ['late', 'Late'], ['away', 'Away'], ['leave', 'Leave']], k, 'data-sst') + '</div>' +
          ((k === 'late' || k === 'away') ? '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">' + [15, 30, 45, 60].map(function (m) { return '<button class="ichip' + ((s.mins || 30) === m ? ' on' : '') + '" data-smin="' + m + '">' + (m === 60 ? '1 hr' : m + ' min') + '</button>'; }).join('') + '</div>' : '') +
          '<div class="ifoot" style="padding-left:4px">Patients waiting today get a WhatsApp about it.</div><button class="ib pri" id="savest" style="margin-top:14px">Update everywhere</button>';
      } else if (s.t === 'menu') {
        var L = S.d.links || {};
        inner = '<div class="ishead"><span style="width:56px"></span><span style="font-size:17px;font-weight:600">' + esc(S.d.me.name) + ' · ' + esc(S.d.me.role) + '</span><button class="ilink" data-close="1" style="font-weight:600">Done</button></div><div class="ilist" style="margin:16px 0 0">' +
          (L.poster ? '<a class="irow" href="' + esc(L.poster) + '" target="_blank" rel="noopener"><span class="icol"><span>QR poster for reception</span></span>' + CHEV + '</a>' : '') +
          (L.tv ? '<a class="irow" href="' + esc(L.tv) + '" target="_blank" rel="noopener"><span class="icol"><span>Waiting-room TV screen</span></span>' + CHEV + '</a>' : '') +
          '<button class="irow" id="logout" style="color:' + C.bad + '"><span>Log out</span></button></div>';
      }
      return '<div class="isheetbg" data-close="1"><div class="isheet" role="dialog" aria-modal="true"><div class="grab"></div>' + inner + '</div></div>';
    }

    // ---------- draw ----------
    function draw() {
      if (!S.sid) return drawLogin();
      if (!S.d) { $app.innerHTML = '<div class="wrap i"><div class="ifoot" style="padding-top:120px;text-align:center">Loading…</div></div>'; return; }
      var tabs = tabsFor(S.d.me.role); if (tabs.indexOf(S.tab) < 0) S.tab = tabs[0];
      var ae = document.activeElement;
      if (ae && ae.id === 'psearch' && S.tab === 'patients' && !S.pk) { var pl = document.getElementById('plist'); if (pl) { pl.innerHTML = plist(S.d.patients); return; } }
      if (ae && (ae.id === 'pnote' || ae.id === 'fee' || ae.id === 'wn' || ae.id === 'wp')) return;
      var scr = { queue: scrQueue, today: scrToday, register: scrRegister, inbox: scrInbox, patients: scrPatients }[S.tab]();
      var y = window.scrollY;
      var ib = S.d.inbox; var badge = ib ? ib.calls.filter(function (x) { return !x.booked; }).length + ib.callbacks.length : 0;
      var regBadge = S.d.today && S.d.today.nobill ? S.d.today.nobill : 0;
      $app.innerHTML = '<div class="wrap i">' + (S.err ? '<div style="position:sticky;top:0;z-index:4;background:#FFF2F2;color:' + C.bad + ';font-size:13px;text-align:center;padding:calc(env(safe-area-inset-top) + 6px) 8px 6px">' + esc(S.err) + '</div>' : '') +
        '<div class="content">' + scr + '</div>' +
        (S.toast ? '<div class="itoast" role="status">' + esc(S.toast) + '</div>' : '') +
        '<nav class="itabs"><div class="in" style="grid-template-columns:repeat(' + tabs.length + ',minmax(0,1fr))">' + tabs.map(function (t) {
          var bd = t === 'inbox' && badge ? badge : t === 'register' && regBadge ? regBadge : 0;
          return '<button data-tab="' + t + '" class="' + (t === S.tab ? 'on' : '') + '"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON[t] + '</svg>' + LAB[t] + (bd ? '<span class="badge">' + bd + '</span>' : '') + '</button>'; }).join('') + '</div></nav>' +
        sheetHtml() + '</div>';
      window.scrollTo(0, y);
      bind();
    }
    function bind() {
      function on(sel, fn) { [].forEach.call($app.querySelectorAll(sel), function (el) { el.addEventListener('click', function (e) { e.stopPropagation(); fn(el, e); }); }); }
      on('[data-tab]', function (el) { S.tab = el.getAttribute('data-tab'); S.pk = null; if (S.tab === 'register') S.d.register = null; if (S.tab === 'patients') S.d.patients = null; draw(); window.scrollTo(0, 0); call({}); });
      on('[data-a]', function (el) { var a = el.getAttribute('data-a'); el.disabled = true; call({ action: a }, function (r) { toast(r.sent ? 'WhatsApp sent to ' + r.sent + ' patient' + (r.sent > 1 ? 's' : '') : a === 'not_here' ? 'Moved back 2 places' : 'Done'); }); });
      on('[data-sheet]', function (el) { var t = el.getAttribute('data-sheet'); S.sheet = { t: t }; draw(); var f = document.getElementById('wn'); if (f) f.focus(); });
      on('[data-close]', function (el, e) { if (e.target !== el) return; S.sheet = null; draw(); });
      on('.isheet', function () {});
      on('[data-bill]', function (el) { var k = el.getAttribute('data-bill'); var b = (S.d.toBill || []).filter(function (x) { return x.k === k; })[0]; if (!b) return; S.sheet = { t: 'bill', b: b, fee: S.d.fee || 0, m: 'cash', fup: 0 }; draw(); });
      on('[data-m]', function (el) { readFee(); S.sheet.m = el.getAttribute('data-m'); S.sheet.qr = false; draw(); });
      on('[data-fup]', function (el) { readFee(); S.sheet.fup = Number(el.getAttribute('data-fup')); draw(); });
      on('[data-upiqr]', function () { readFee(); S.sheet.qr = true; draw(); });
      on('#savebill', function (el) { readFee(); var s = S.sheet; el.disabled = true; call({ action: 'bill', k: s.b.k, fee: s.fee, m: s.m, fup: s.fup }, function (r) { if (r.billed) { S.sheet = null; toast(r.billed + ' billed' + (s.fup ? ' · reminder set' : '')); } }); });
      on('#addtok', function (el) { var n = (document.getElementById('wn').value || '').trim(), p = (document.getElementById('wp').value || '').trim(); if (!n) { document.getElementById('wn').focus(); return; } el.disabled = true; call({ action: 'add_token', name: n, phone: p }, function (r) { S.sheet = null; if (r.added) toast('Token ' + r.added + (r.sent ? ' · sent on WhatsApp' : '')); }); });
      on('[data-rm]', function (el) { S.sheet = { t: 'rm', key: el.getAttribute('data-rm'), name: el.getAttribute('data-rmname') }; draw(); });
      on('#rmtok', function () { var k = S.sheet.key; S.sheet = null; call({ action: 'remove_token', key: k }, function () { toast('Removed'); }); });
      on('[data-sst]', function (el) { S.sheet.st = el.getAttribute('data-sst'); draw(); });
      on('[data-smin]', function (el) { S.sheet.mins = Number(el.getAttribute('data-smin')); draw(); });
      on('#savest', function (el) { var s = S.sheet, st = s.st || S.d.doc.status; el.disabled = true; call({ action: 'set_status', status: st, mins: st === 'late' || st === 'away' ? (s.mins || 30) : 0 }, function (r) { S.sheet = null; toast(r.told ? 'Updated · ' + r.told + ' patients told' : 'Updated everywhere'); }); });
      on('[data-st]', function (el) { var st = el.getAttribute('data-st'); var m = (st === 'late' || st === 'away') ? 30 : 0; call({ action: 'set_status', status: st, mins: m }, function (r) { toast(r.told ? r.told + ' patients told on WhatsApp' : 'Status updated'); }); });
      on('[data-mins]', function (el) { call({ action: 'set_status', status: el.getAttribute('data-for'), mins: Number(el.getAttribute('data-mins')) }, function (r) { toast(r.told ? r.told + ' patients told on WhatsApp' : 'Status updated'); }); });
      on('[data-per]', function (el) { S.per = el.getAttribute('data-per'); S.d.register = null; draw(); call({}); });
      on('[data-seg]', function (el) { S.seg = el.getAttribute('data-seg'); draw(); });
      on('[data-done]', function (el) { call({ action: el.getAttribute('data-done'), phone: el.getAttribute('data-ph') }, function () { toast('Done'); }); });
      on('[data-pk]', function (el) { S.pk = el.getAttribute('data-pk'); S.d.patient = null; draw(); window.scrollTo(0, 0); call({}); });
      on('[data-back]', function () { S.pk = null; draw(); call({}); });
      on('[data-tokfor]', function () { var p = S.d.patient; S.sheet = { t: 'add', name: p.name, phone: p.call ? p.call.replace(/\D/g, '').replace(/^91(?=\d{10}$)/, '') : '' }; draw(); });
      on('#savenote', function () { var t = document.getElementById('pnote').value; call({ action: 'note', pk: S.pk, text: t }, function () { toast('Note saved'); }); });
      on('#logout', function () { S.sheet = null; logout(); });
      var ps = document.getElementById('psearch');
      if (ps) { var tm; ps.addEventListener('input', function () { S.q = ps.value; clearTimeout(tm); tm = setTimeout(function () { call({}); }, 300); }); }
      var fee = document.getElementById('fee');
      if (fee) fee.addEventListener('input', function () { fee.value = fee.value.replace(/\D/g, '').slice(0, 6); S.sheet.fee = Number(fee.value) || 0; var sb = document.getElementById('savebill'); if (sb) sb.textContent = 'Save · ' + rupee(S.sheet.fee) + ' ' + (S.sheet.m === 'upi' ? 'UPI' : 'Cash'); });
    }
    function readFee() { var f = document.getElementById('fee'); if (f && S.sheet) S.sheet.fee = Number(f.value) || 0; }

    var code = qs.get('code');
    if (code) {
      history.replaceState(null, '', location.pathname);
      $app.innerHTML = '<div class="wrap i"><div class="ifoot" style="padding-top:120px;text-align:center">Logging you in…</div></div>';
      post({ action: 'login', code: code }).then(function (r) {
        if (!r.ok) return drawLogin(r.error || 'Login link not valid.');
        store('cd_sid', r.sid); store('cd_role', r.role); if (r.clinic && r.clinic.botNumber) store('cd_bot', r.clinic.botNumber);
        S.sid = r.sid; S.role = r.role; call({});
      }).catch(function () { drawLogin('Could not reach the server. Try again.'); });
    } else if (S.sid) { draw(); call({}); } else drawLogin();
    setInterval(poll, 8000);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) poll(); });
  }

  var v = qs.get('v');
  if (v === 't') tracker(qs.get('k'));
  else if (v === 'tv') tv(qs.get('k'));
  else if (v === 'qr') poster();
  else staff();
})();
</script>
</body>
</html>
