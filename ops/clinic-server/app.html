<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="robots" content="noindex">
<title>Clinic Desk</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#F2F4F7;color:#101828;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
a{color:#175CD3}
.wrap{max-width:520px;margin:0 auto;min-height:100vh;background:#F2F4F7;display:flex;flex-direction:column;position:relative}
.white{background:#FFFFFF}
.top{background:#FFF;padding:calc(env(safe-area-inset-top) + 16px) 16px 12px;border-bottom:1px solid #EAECF0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.h1{font-size:22px;font-weight:700;letter-spacing:-.2px}
.sub{font-size:13px;color:#667085}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;border-radius:16px;padding:6px 10px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.card{background:#FFF;border:1px solid #EAECF0;border-radius:14px}
.sec{padding:14px 16px 6px;font-size:13px;font-weight:600;color:#475467;display:flex;justify-content:space-between}
.row{display:flex;align-items:center;gap:12px;padding:11px 12px;border-bottom:1px solid #F2F4F7}
.row:last-child{border-bottom:none}
.btn{height:48px;border-radius:12px;border:1px solid #D0D5DD;background:#FFF;font-size:15px;font-weight:600;color:#344054;padding:0 14px}
.btn.pri{background:#175CD3;border-color:#175CD3;color:#FFF}
.btn.big{height:60px;font-size:17px;font-weight:700;width:100%}
.btn.sm{height:36px;font-size:13px;border-radius:8px;padding:0 12px}
.btn:disabled{opacity:.45;cursor:default}
.content{flex:1;padding-bottom:96px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#FFF;border-top:1px solid #EAECF0;padding:8px 0 calc(env(safe-area-inset-bottom) + 10px)}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid}
nav.tabs button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:500;color:#667085;position:relative;padding:4px 0}
nav.tabs button.on{color:#175CD3;font-weight:600}
.badge{position:absolute;top:-2px;left:55%;min-width:18px;height:18px;border-radius:9px;background:#D92D20;color:#FFF;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 4px}
.toast{margin:10px 12px 0;padding:10px 12px;border-radius:12px;background:#101828;color:#FFF;font-size:13px;line-height:1.45}
.sheet-bg{position:fixed;inset:0;background:rgba(16,24,40,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:#FFF;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom) + 24px);display:flex;flex-direction:column;gap:12px}
.grab{align-self:center;width:36px;height:4px;border-radius:2px;background:#D0D5DD}
input.f{height:48px;border:1px solid #D0D5DD;border-radius:10px;padding:0 12px;font-size:16px;font-family:inherit;width:100%}
.seg{display:grid;background:#F2F4F7;border-radius:10px;padding:3px}
.seg button{height:34px;border:none;border-radius:8px;font-size:13px;font-weight:600;background:transparent;color:#667085}
.seg button.on{background:#FFF;color:#101828;box-shadow:0 1px 2px rgba(16,24,40,.1)}
.empty{padding:28px 16px;text-align:center;color:#667085;font-size:14px}
.tok{font-variant-numeric:tabular-nums}
.fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:96px;height:52px;padding:0 18px;border-radius:16px;border:none;background:#101828;color:#FFF;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;box-shadow:0 6px 16px rgba(16,24,40,.25);z-index:5}
.bub{max-width:80%;padding:8px 12px;border-radius:14px;font-size:15px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
.err{margin:12px;padding:12px;border-radius:12px;background:#FEF3F2;color:#B42318;font-size:14px}

/* ---- v6: iOS-style staff app ---- */
.wrap.i{background:#F2F2F7;color:#000;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.i .content{padding-bottom:110px}
.ihd{padding:calc(env(safe-area-inset-top) + 18px) 16px 4px 20px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.ilt{margin:0;font-size:34px;font-weight:700;letter-spacing:.3px;line-height:1.1}
.icirc{width:34px;height:34px;border-radius:17px;border:none;background:#E3E3E8;color:#0A63D6;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ipill{height:32px;padding:0 12px;border-radius:16px;border:none;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap}
.ipill:disabled{cursor:default;opacity:1}
.icard{background:#FFF;border-radius:16px}
.itile{padding:12px;display:flex;flex-direction:column;font-family:inherit;color:#000}
.itile .tok{font-size:24px;font-weight:600}
.isec{padding:22px 32px 7px;display:flex;justify-content:space-between;gap:10px;font-size:13px;color:#6C6C70}
.ilist{margin:0 16px;background:#FFF;border-radius:12px;overflow:hidden}
.irow{width:100%;display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:48px;border:none;border-bottom:1px solid #E5E5EA;background:#FFF;color:#000;font-size:17px;text-align:left;text-decoration:none;font-family:inherit;box-sizing:border-box}
.irow:last-child{border-bottom:none}
button.irow:active,a.irow:active{background:#E5E5EA}
.icol{flex-grow:1;display:flex;flex-direction:column;min-width:0}
.isub{font-size:13px;color:#6C6C70}
.ifoot{padding:7px 32px 0;font-size:13px;color:#6C6C70;line-height:1.4}
.ib{width:100%;height:54px;border-radius:14px;border:none;background:#FFF;color:#0A63D6;font-size:17px;font-family:inherit;display:flex;align-items:center;justify-content:center;margin-top:8px}
.ib.pri{background:#0A63D6;color:#FFF;font-weight:600;margin-top:0}
.ib.soft{background:#EAF2FD;font-weight:600;height:44px;font-size:15px;margin:0}
.ib:disabled{opacity:.4;cursor:default}
.igray{height:34px;padding:0 14px;border-radius:17px;border:none;background:#EFEFF4;color:#000;font-size:15px;flex-shrink:0}
.ichip{height:34px;padding:0 14px;border-radius:17px;border:1px solid #D1D1D6;background:#FFF;color:#000;font-size:15px}
.ichip.on{background:#0A63D6;border-color:#0A63D6;color:#FFF}
.iseg{display:grid;background:#E3E3E8;border-radius:9px;padding:2px;gap:2px}
.iseg button{height:32px;border:none;border-radius:7px;background:transparent;font-size:14px;color:#000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.iseg button.on{background:#FFF;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.isheet .iseg{background:#EFEFF4}
.iround{width:36px;height:36px;border-radius:18px;background:#EAF2FD;color:#0A63D6;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ilink{border:none;background:none;color:#0A63D6;font-size:17px;padding:4px 0;font-family:inherit}
.iback{border:none;background:none;color:#0A63D6;font-size:17px;display:flex;align-items:center;gap:4px;padding:8px;font-family:inherit}
.iact{height:58px;border-radius:12px;border:none;background:#FFF;color:#0A63D6;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;font-family:inherit}
.isearch{height:38px;border-radius:10px;background:#E3E3E8;display:flex;align-items:center;gap:8px;padding:0 10px;color:#6C6C70}
.isearch input{border:none;outline:none;background:transparent;font:inherit;font-size:17px;flex-grow:1;min-width:0;color:#000}
.ifield{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #E5E5EA;font-size:17px}
.ifield span{width:64px;flex-shrink:0}
.ifield input{border:none;outline:none;font:inherit;flex-grow:1;min-width:0;background:transparent}
.i textarea{width:100%;box-sizing:border-box;border:none;outline:none;resize:vertical;font:inherit;font-size:17px;line-height:1.35;padding:8px 0;min-height:64px}
.itabs{position:fixed;bottom:0;left:0;right:0;background:rgba(249,249,249,.94);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid #D1D1D6;padding:7px 0 calc(env(safe-area-inset-bottom) + 8px);z-index:6}
.itabs .in{max-width:520px;margin:0 auto;display:grid}
.itabs button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;color:#6C6C70;position:relative;padding:2px 0;font-family:inherit}
.itabs button.on{color:#0A63D6}
.itabs .badge{background:#D70015;left:56%}
.itoast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 84px);max-width:340px;background:rgba(28,28,30,.92);color:#FFF;font-size:15px;padding:11px 16px;border-radius:14px;z-index:8;text-align:center}
.isheetbg{position:fixed;inset:0;background:rgba(0,0,0,.28);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.isheet{background:#F2F2F7;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:12px 12px 0 0;padding:6px 16px calc(env(safe-area-inset-bottom) + 24px);box-sizing:border-box;display:flex;flex-direction:column}
.isheet .grab{background:#C4C4C7;width:36px;height:5px;border-radius:3px;align-self:center}
.ishead{display:flex;justify-content:space-between;align-items:center;padding-top:10px}

/* ---- v7: doctor app in the v5 look ---- */
.wrap.i.dwhite{background:#FFF}
.dpage{color:#101828;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.dstat{height:64px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:12.5px;font-weight:600;line-height:1.2;text-align:center;font-family:inherit;padding:0 2px}
.dcard{border:1px solid #EAECF0;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;background:#FFF}
.dcap{font-size:12px;font-weight:700;letter-spacing:.6px;color:#175CD3}
.dplain{border:none;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:4px;color:#101828;font-family:inherit;min-width:0}
.dplain:disabled{cursor:default}
.dchip{font-size:12.5px;font-weight:600;color:#344054;background:#F2F4F7;border-radius:12px;padding:4px 10px}
.dbtn{height:48px;border-radius:12px;border:none;background:#175CD3;color:#FFF;font-size:16px;font-weight:700;font-family:inherit;width:100%}
.dbtn:disabled{opacity:.45;cursor:default}
.dbtn2{height:46px;border-radius:12px;border:1px solid #D0D5DD;background:#FFF;color:#344054;font-size:15px;font-weight:600;font-family:inherit;width:100%;margin-top:6px}
.dsec{padding:20px 16px 8px;display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:700;color:#101828}
.dsec span:last-child{font-size:13px;font-weight:400;color:#667085}
.drow{width:100%;display:flex;align-items:center;gap:12px;padding:11px 0;border:none;border-top:1px solid #F2F4F7;background:none;text-align:left;color:#101828;font-family:inherit;text-decoration:none;box-sizing:border-box;min-height:48px}
.drow:disabled{cursor:default}
.dsub{font-size:13px;color:#667085;line-height:1.4}
.drow .dsub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dtile{border:1px solid #EAECF0;border-radius:12px;background:#FFF;padding:12px;display:flex;flex-direction:column;align-items:flex-start;font-family:inherit;color:#101828}
.dwarn{margin:8px 16px 0;width:calc(100% - 32px);border:none;border-radius:12px;background:#FFFAEB;color:#B54708;font-size:14px;font-weight:600;padding:12px;text-align:left;font-family:inherit}
.dmini{height:34px;padding:0 12px;border-radius:8px;border:1px solid #D0D5DD;background:#FFF;color:#344054;font-size:13px;font-weight:600;display:flex;align-items:center;text-decoration:none;flex-shrink:0;font-family:inherit}
.dinput{height:46px;border:1px solid #D0D5DD;border-radius:10px;padding:0 12px;font-size:16px;font-family:inherit;width:100%;box-sizing:border-box;color:#101828;background:#FFF}
.dlab{font-size:13px;font-weight:600;color:#475467;margin-top:12px;display:block}
.dh{margin:4px 0 4px;font-size:26px;font-weight:700;letter-spacing:-.3px}
.dopt{height:48px;border-radius:12px;font-size:14px;font-weight:600;font-family:inherit}
.itabs.dtabs{background:#FFF;-webkit-backdrop-filter:none;backdrop-filter:none;border-top:1px solid #EAECF0}
.itabs.dtabs button{font-size:12px;color:#667085}
.itabs.dtabs button.on{color:#175CD3;font-weight:600}
.asbar{position:sticky;top:0;z-index:7;background:#101828;color:#FFF;font-size:13px;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px 16px}
.asbar button{border:none;background:#FFF;color:#101828;border-radius:14px;height:28px;padding:0 12px;font-size:13px;font-weight:600;font-family:inherit}

.phonein{margin-top:26px;height:56px;border-radius:12px;background:#F2F2F7;display:flex;align-items:center;gap:10px;padding:0 16px;font-size:20px}
.phonein span{color:#6C6C70}
.phonein input{border:none;outline:none;background:transparent;font:inherit;font-size:20px;flex:1;min-width:0;letter-spacing:.5px;color:#000}
.otpin{margin-top:26px;height:64px;border:none;border-radius:12px;background:#F2F2F7;text-align:center;font-size:32px;letter-spacing:12px;font-family:inherit;outline:none;width:100%;box-sizing:border-box;font-variant-numeric:tabular-nums}

/* ---- v8: one design language (the v5 look) for every screen ---- */
.wrap.i{background:#FFF;color:#101828}
.ihd{padding:calc(env(safe-area-inset-top) + 20px) 16px 4px 16px}
.ilt{font-size:24px;letter-spacing:-.3px}
.icirc{background:#F2F4F7;color:#344054}
.icard{background:#FFF;border:1px solid #EAECF0;border-radius:14px}
.isec{padding:20px 16px 8px;font-size:15px;font-weight:700;color:#101828;align-items:baseline}
.isec span:last-child{font-size:13px;font-weight:400;color:#667085}
.ilist{margin:0 16px;border:1px solid #EAECF0;border-radius:14px}
.irow{font-size:15px;padding:11px 14px;border-bottom:1px solid #F2F4F7;color:#101828}
.irow .icol>span:first-child{font-weight:600}
button.irow:active,a.irow:active{background:#F9FAFB}
.isub{color:#667085}
.ifoot{padding:8px 16px 0;color:#667085;font-size:12.5px}
.ib{height:52px;border-radius:12px;font-size:16px;color:#175CD3;border:1px solid #D0D5DD}
.ib.pri{background:#175CD3;border:none;font-weight:700}
.ib.soft{background:#EFF4FF;border:none}
.igray{height:36px;border:1px solid #D0D5DD;background:#FFF;border-radius:10px;font-size:13px;font-weight:600;color:#344054}
.ichip{border-radius:10px;font-size:14px;font-weight:600;color:#344054;border:1px solid #D0D5DD;height:40px}
.ichip.on{background:#EFF4FF;border:2px solid #175CD3;color:#175CD3}
.iseg{background:#F2F4F7;border-radius:10px;padding:3px}
.iseg button{height:34px;border-radius:8px;font-size:13px;font-weight:600;color:#667085}
.iseg button.on{color:#101828;box-shadow:0 1px 2px rgba(16,24,40,.12)}
.iround{background:#EFF4FF;color:#175CD3}
.ilink{color:#175CD3;font-size:15px}
.iback{color:#175CD3;font-size:15px}
.iact{background:#FFF;border:1px solid #EAECF0;color:#175CD3;font-weight:600}
.isearch{background:#FFF;border:1px solid #D0D5DD;height:44px;color:#667085}
.ifield{border-bottom:1px solid #F2F4F7;font-size:15px}
.ipill{height:30px}
.itabs{background:#FFF;-webkit-backdrop-filter:none;backdrop-filter:none;border-top:1px solid #EAECF0}
.itabs button{font-size:12px;color:#667085}
.itabs button.on{color:#175CD3;font-weight:600}
.itabs .badge{background:#D92D20}
.isheetbg{background:rgba(16,24,40,.45)}
.isheet{background:#FFF;border-radius:20px 20px 0 0}
.isheet .ilist{background:#FFF}
.isheet.up{animation:sheetup .24s cubic-bezier(.2,.8,.2,1)}
@keyframes sheetup{from{transform:translateY(100%)}to{transform:none}}
.itoast{top:calc(env(safe-area-inset-top) + 12px);bottom:auto;background:#101828;font-size:14px;border-radius:12px;padding:10px 14px;box-shadow:0 8px 24px rgba(16,24,40,.18);animation:toastin .2s ease-out}
@keyframes toastin{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
.tp{font-size:.48em;font-weight:700;color:#98A2B3;margin-right:3px;vertical-align:.6em;letter-spacing:0}
.qgrid{display:flex;flex-direction:column}
/* reception on a laptop: a real desk, not a phone strip */
@media (min-width:900px){
  .wrap.i.recep{max-width:1120px}
  .wrap.i.recep .content{padding:0 16px 110px}
  .qgrid{display:grid;grid-template-columns:1.15fr 1fr;grid-template-areas:"now bill" "next booked";column-gap:8px;align-items:start}
  .qa-now{grid-area:now}.qa-bill{grid-area:bill}.qa-booked{grid-area:booked}.qa-next{grid-area:next}
  .itabs .in{max-width:520px}
}

/* ---- v9: consult panel, smart bill, laptop shell ---- */
.clab{font-size:12px;font-weight:700;letter-spacing:.4px;color:#667085;text-transform:uppercase;margin-top:4px}
.nchips,.fchips{display:flex;flex-wrap:wrap;gap:6px}
.nchip{height:32px;padding:0 10px;border-radius:16px;border:1px solid #EAECF0;background:#F9FAFB;color:#344054;font-size:13px;font-weight:500;font-family:inherit}
.nchip:active{background:#EFF4FF}
.cnote{width:100%;box-sizing:border-box;border:1px solid #D0D5DD;border-radius:10px;padding:10px 12px;font:inherit;font-size:15px;line-height:1.4;resize:vertical;min-height:56px;color:#101828}
.cnote:focus,.dinput:focus{outline:2px solid #B2CCFF;border-color:#175CD3}
.fchip{height:36px;padding:0 14px;border-radius:10px;border:1px solid #D0D5DD;background:#FFF;color:#344054;font-size:14px;font-weight:600;font-family:inherit}
.fchip.on{background:#EFF4FF;border:2px solid #175CD3;color:#175CD3}
.kbd{display:none}
.hint{margin-top:12px;padding:10px 12px;border-radius:10px;background:#EFF4FF;color:#1849A9;font-size:14px;line-height:1.45}
.qa-side{display:flex;flex-direction:column}
@media (min-width:900px) and (max-width:1023px){.qgrid{grid-template-areas:"now side" "next side"}.qa-side{grid-area:side}}
/* laptop / desktop */
.dshell{min-height:100vh;background:#F9FAFB;color:#101828;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.side{position:fixed;top:0;bottom:0;left:0;width:228px;background:#FFF;border-right:1px solid #EAECF0;padding:22px 12px 16px;display:flex;flex-direction:column;box-sizing:border-box}
.sclinic{font-size:15px;font-weight:700;padding:0 10px;line-height:1.3}
.srole{font-size:13px;color:#667085;padding:2px 10px 18px}
.snav{display:flex;flex-direction:column;gap:2px}
.sitem{display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;border:none;background:none;border-radius:8px;font-size:14px;font-weight:500;color:#344054;text-align:left;font-family:inherit;position:relative;width:100%}
.sitem:hover{background:#F9FAFB}
.sitem.on{background:#EFF4FF;color:#175CD3;font-weight:600}
.sbadge{margin-left:auto;min-width:20px;height:20px;border-radius:10px;background:#F2F4F7;color:#344054;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 6px}
.skey{font-size:12px;color:#98A2B3;padding:8px 10px}
.dmain{margin-left:228px;padding:6px 20px 48px;box-sizing:border-box;min-height:100vh}
.dmain .ihd,.dmain .dpage>div:first-child{padding-top:22px !important}
.dmain.t-register>*,.dmain.t-inbox>*,.dmain.t-clinic>*{max-width:820px}
.dmain .dpage,.dmain .content{background:transparent}
.dmain .icard,.dmain .ilist,.dmain .dcard,.dmain .dtile{background:#FFF}

    var wl = null; function keepAwake() { try { if ('wakeLock' in navigator && !wl && !document.hidden && S.tab === 'today' && isDoc()) navigator.wakeLock.request('screen').then(function (l) { wl = l; l.addEventListener('release', function () { wl = null; }); }).catch(function () {}); } catch (e) {} }
    setInterval(keepAwake, 5000); document.addEventListener('visibilitychange', keepAwake);
    window.addEventListener('resize', function () { var d = window.matchMedia('(min-width: 1024px)').matches; if (d !== S.desk) { S.desk = d; S.lastHtml = null; draw(); } });
    document.addEventListener('keydown', function (e) {
      if ((e.key !== 'n' && e.key !== 'N') || e.ctrlKey || e.metaKey || e.altKey || S.sheet || !S.d) return;
      var t = e.target; if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
      var b = document.getElementById('cdone') || document.querySelector('[data-a="call_next"]'); if (b && !b.disabled) { e.preventDefault(); b.click(); }
    });
    (function () { var m = location.hash.match(/^#report\/(\w+)\/(today|7|30)$/); if (m) { S.tab = 'after'; S.rd = m[1]; S.rper = m[2]; } })();
    var code = qs.get('code');
    if (code) {
      history.replaceState(null, '', location.pathname);
      $app.innerHTML = '<div class="wrap i"><div class="ifoot" style="padding-top:120px;text-align:center">Logging you in…</div></div>';
      post({ action: 'login', code: code, ua: uaShort() }).then(function (r) {
        if (!r.ok) return drawLogin(r.error || 'Login link not valid.');
        store('cd_sid', r.sid); store('cd_role', r.role); if (r.clinic && r.clinic.botNumber) store('cd_bot', r.clinic.botNumber);
        S.sid = r.sid; S.role = r.role; call({});
      }).catch(function () { drawLogin('Could not reach the server. Try again.'); });
    } else if (S.sid) { draw(); call({}); } else drawLogin();
    setInterval(poll, 8000);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) poll(); });
  }


  function invoice(id) {
    $app.innerHTML = '<div class="wrap white"><div class="empty">Loading…</div></div>';
    post({ action: 'inv', id: id }).then(function (d) {
      var e = function (x) { return String(x == null ? '' : x).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
      var rp = function (n) { return '₹' + Number(n || 0).toLocaleString('en-IN'); };
      if (!d.ok) { $app.innerHTML = '<div class="wrap white"><div style="padding:60px 24px;text-align:center;font-size:18px;font-weight:600">This invoice link is not valid.</div></div>'; return; }
      document.title = 'Invoice #' + d.no + ' · ' + d.clinic.name;
      $app.innerHTML = '<div class="invw"><div class="inv">' +
        '<div class="invh"><div><div class="invc">' + e(d.clinic.name) + '</div><div class="invs">' + e(d.clinic.doctor) + (d.clinic.address ? '<br>' + e(d.clinic.address) : '') + '</div></div><div style="text-align:right"><div class="invt">INVOICE</div><div class="invs">#' + e(d.no) + '<br>' + e(d.date) + (d.time ? ', ' + e(d.time) : '') + '</div></div></div>' +
        '<div class="invp"><span class="invs">Patient</span><b>' + e(d.name) + '</b>' + (d.phone ? '<span class="invs">' + e(d.phone) + '</span>' : '') + '</div>' +
        '<table class="invtb"><thead><tr><th>Item</th><th style="text-align:right">Amount</th></tr></thead><tbody>' + d.items.map(function (i) { return '<tr><td>' + e(i.n) + '</td><td style="text-align:right">' + rp(i.p) + '</td></tr>'; }).join('') + '</tbody>' +
        '<tfoot><tr><td>Total paid</td><td style="text-align:right">' + rp(d.total) + '</td></tr></tfoot></table>' +
        '<div class="invs" style="margin-top:10px">Paid by ' + (d.m === 'upi' ? 'UPI' : d.m === 'free' ? '—' : 'cash') + (d.by ? ' · received by ' + e(d.by) : '') + '</div>' +
        '<div class="invf">Thank you. Keep this invoice for your records.</div></div>' +
        '<button class="invbtn" onclick="window.print()">Print / Save as PDF</button></div>';
    }).catch(function () { $app.innerHTML = '<div class="wrap white"><div class="empty">Could not load. Check your internet.</div></div>'; });
  }
  var v = qs.get('v');
  if (qs.get('inv')) invoice(qs.get('inv'));
  else if (v === 't') tracker(qs.get('k'));
  else if (v === 'tv') tv(qs.get('k'));
  else if (v === 'qr') poster();
  else staff();
})();
</script>
</body>
</html>
