<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="robots" content="noindex">
<title>Clinic Desk</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#F2F4F7;color:#101828;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
a{color:#175CD3}
.wrap{max-width:520px;margin:0 auto;min-height:100vh;background:#F2F4F7;display:flex;flex-direction:column;position:relative}
.white{background:#FFFFFF}
.top{background:#FFF;padding:calc(env(safe-area-inset-top) + 16px) 16px 12px;border-bottom:1px solid #EAECF0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.h1{font-size:22px;font-weight:700;letter-spacing:-.2px}
.sub{font-size:13px;color:#667085}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;border-radius:16px;padding:6px 10px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.card{background:#FFF;border:1px solid #EAECF0;border-radius:14px}
.sec{padding:14px 16px 6px;font-size:13px;font-weight:600;color:#475467;display:flex;justify-content:space-between}
.row{display:flex;align-items:center;gap:12px;padding:11px 12px;border-bottom:1px solid #F2F4F7}
.row:last-child{border-bottom:none}
.btn{height:48px;border-radius:12px;border:1px solid #D0D5DD;background:#FFF;font-size:15px;font-weight:600;color:#344054;padding:0 14px}
.btn.pri{background:#175CD3;border-color:#175CD3;color:#FFF}
.btn.big{height:60px;font-size:17px;font-weight:700;width:100%}
.btn.sm{height:36px;font-size:13px;border-radius:8px;padding:0 12px}
.btn:disabled{opacity:.45;cursor:default}
.content{flex:1;padding-bottom:96px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#FFF;border-top:1px solid #EAECF0;padding:8px 0 calc(env(safe-area-inset-bottom) + 10px)}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid}
nav.tabs button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:500;color:#667085;position:relative;padding:4px 0}
nav.tabs button.on{color:#175CD3;font-weight:600}
.badge{position:absolute;top:-2px;left:55%;min-width:18px;height:18px;border-radius:9px;background:#D92D20;color:#FFF;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 4px}
.toast{margin:10px 12px 0;padding:10px 12px;border-radius:12px;background:#101828;color:#FFF;font-size:13px;line-height:1.45}
.sheet-bg{position:fixed;inset:0;background:rgba(16,24,40,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:#FFF;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom) + 24px);display:flex;flex-direction:column;gap:12px}
.grab{align-self:center;width:36px;height:4px;border-radius:2px;background:#D0D5DD}
input.f{height:48px;border:1px solid #D0D5DD;border-radius:10px;padding:0 12px;font-size:16px;font-family:inherit;width:100%}
.seg{display:grid;background:#F2F4F7;border-radius:10px;padding:3px}
.seg button{height:34px;border:none;border-radius:8px;font-size:13px;font-weight:600;background:transparent;color:#667085}
.seg button.on{background:#FFF;color:#101828;box-shadow:0 1px 2px rgba(16,24,40,.1)}
.empty{padding:28px 16px;text-align:center;color:#667085;font-size:14px}
.tok{font-variant-numeric:tabular-nums}
.fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:96px;height:52px;padding:0 18px;border-radius:16px;border:none;background:#101828;color:#FFF;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;box-shadow:0 6px 16px rgba(16,24,40,.25);z-index:5}
.bub{max-width:80%;padding:8px 12px;border-radius:14px;font-size:15px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
.err{margin:12px;padding:12px;border-radius:12px;background:#FEF3F2;color:#B42318;font-size:14px}

/* ---- v6: iOS-style staff app ---- */
.wrap.i{background:#F2F2F7;color:#000;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.i .content{padding-bottom:110px}
.ihd{padding:calc(env(safe-area-inset-top) + 18px) 16px 4px 20px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.ilt{margin:0;font-size:34px;font-weight:700;letter-spacing:.3px;line-height:1.1}
.icirc{width:34px;height:34px;border-radius:17px;border:none;background:#E3E3E8;color:#0A63D6;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ipill{height:32px;padding:0 12px;border-radius:16px;border:none;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap}
.ipill:disabled{cursor:default;opacity:1}
.icard{background:#FFF;border-radius:16px}
.itile{padding:12px;display:flex;flex-direction:column;font-family:inherit;color:#000}
.itile .tok{font-size:24px;font-weight:600}
.isec{padding:22px 32px 7px;display:flex;justify-content:space-between;gap:10px;font-size:13px;color:#6C6C70}
.ilist{margin:0 16px;background:#FFF;border-radius:12px;overflow:hidden}
.irow{width:100%;display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:48px;border:none;border-bottom:1px solid #E5E5EA;background:#FFF;color:#000;font-size:17px;text-align:left;text-decoration:none;font-family:inherit;box-sizing:border-box}
.irow:last-child{border-bottom:none}
button.irow:active,a.irow:active{background:#E5E5EA}
.icol{flex-grow:1;display:flex;flex-direction:column;min-width:0}
.isub{font-size:13px;color:#6C6C70}
.ifoot{padding:7px 32px 0;font-size:13px;color:#6C6C70;line-height:1.4}
.ib{width:100%;height:54px;border-radius:14px;border:none;background:#FFF;color:#0A63D6;font-size:17px;font-family:inherit;display:flex;align-items:center;justify-content:center;margin-top:8px}
.ib.pri{background:#0A63D6;color:#FFF;font-weight:600;margin-top:0}
.ib.soft{background:#EAF2FD;font-weight:600;height:44px;font-size:15px;margin:0}
.ib:disabled{opacity:.4;cursor:default}
.igray{height:34px;padding:0 14px;border-radius:17px;border:none;background:#EFEFF4;color:#000;font-size:15px;flex-shrink:0}
.ichip{height:34px;padding:0 14px;border-radius:17px;border:1px solid #D1D1D6;background:#FFF;color:#000;font-size:15px}
.ichip.on{background:#0A63D6;border-color:#0A63D6;color:#FFF}
.iseg{display:grid;background:#E3E3E8;border-radius:9px;padding:2px;gap:2px}
.iseg button{height:32px;border:none;border-radius:7px;background:transparent;font-size:14px;color:#000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.iseg button.on{background:#FFF;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.isheet .iseg{background:#EFEFF4}
.iround{width:36px;height:36px;border-radius:18px;background:#EAF2FD;color:#0A63D6;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ilink{border:none;background:none;color:#0A63D6;font-size:17px;padding:4px 0;font-family:inherit}
.iback{border:none;background:none;color:#0A63D6;font-size:17px;display:flex;align-items:center;gap:4px;padding:8px;font-family:inherit}
.iact{height:58px;border-radius:12px;border:none;background:#FFF;color:#0A63D6;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;font-family:inherit}
.isearch{height:38px;border-radius:10px;background:#E3E3E8;display:flex;align-items:center;gap:8px;padding:0 10px;color:#6C6C70}
.isearch input{border:none;outline:none;background:transparent;font:inherit;font-size:17px;flex-grow:1;min-width:0;color:#000}
.ifield{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #E5E5EA;font-size:17px}
.ifield span{width:64px;flex-shrink:0}
.ifield input{border:none;outline:none;font:inherit;flex-grow:1;min-width:0;background:transparent}
.i textarea{width:100%;box-sizing:border-box;border:none;outline:none;resize:vertical;font:inherit;font-size:17px;line-height:1.35;padding:8px 0;min-height:64px}
.itabs{position:fixed;bottom:0;left:0;right:0;background:rgba(249,249,249,.94);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid #D1D1D6;padding:7px 0 calc(env(safe-area-inset-bottom) + 8px);z-index:6}
.itabs .in{max-width:520px;margin:0 auto;display:grid}
.itabs button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;color:#6C6C70;position:relative;padding:2px 0;font-family:inherit}
.itabs button.on{color:#0A63D6}
.itabs .badge{background:#D70015;left:56%}
.itoast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 84px);max-width:340px;background:rgba(28,28,30,.92);color:#FFF;font-size:15px;padding:11px 16px;border-radius:14px;z-index:8;text-align:center}
.isheetbg{position:fixed;inset:0;background:rgba(0,0,0,.28);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.isheet{background:#F2F2F7;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:12px 12px 0 0;padding:6px 16px calc(env(safe-area-inset-bottom) + 24px);box-sizing:border-box;display:flex;flex-direction:column}
.isheet .grab{background:#C4C4C7;width:36px;height:5px;border-radius:3px;align-self:center}
.ishead{display:flex;justify-content:space-between;align-items:center;padding-top:10px}

/* ---- v7: doctor app in the v5 look ---- */
.wrap.i.dwhite{background:#FFF}
.dpage{color:#101828;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.dstat{height:64px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:12.5px;font-weight:600;line-height:1.2;text-align:center;font-family:inherit;padding:0 2px}
.dcard{border:1px solid #EAECF0;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;background:#FFF}
.dcap{font-size:12px;font-weight:700;letter-spacing:.6px;color:#175CD3}
.dplain{border:none;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:4px;color:#101828;font-family:inherit;min-width:0}
.dplain:disabled{cursor:default}
.dchip{font-size:12.5px;font-weight:600;color:#344054;background:#F2F4F7;border-radius:12px;padding:4px 10px}
.dbtn{height:48px;border-radius:12px;border:none;background:#175CD3;color:#FFF;font-size:16px;font-weight:700;font-family:inherit;width:100%}
.dbtn:disabled{opacity:.45;cursor:default}
.dbtn2{height:46px;border-radius:12px;border:1px solid #D0D5DD;background:#FFF;color:#344054;font-size:15px;font-weight:600;font-family:inherit;width:100%;margin-top:6px}
.dsec{padding:20px 16px 8px;display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:700;color:#101828}
.dsec span:last-child{font-size:13px;font-weight:400;color:#667085}
.drow{width:100%;display:flex;align-items:center;gap:12px;padding:11px 0;border:none;border-top:1px solid #F2F4F7;background:none;text-align:left;color:#101828;font-family:inherit;text-decoration:none;box-sizing:border-box;min-height:48px}
.drow:disabled{cursor:default}
.dsub{font-size:13px;color:#667085;line-height:1.4}
.drow .dsub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dtile{border:1px solid #EAECF0;border-radius:12px;background:#FFF;padding:12px;display:flex;flex-direction:column;align-items:flex-start;font-family:inherit;color:#101828}
.dwarn{margin:8px 16px 0;width:calc(100% - 32px);border:none;border-radius:12px;background:#FFFAEB;color:#B54708;font-size:14px;font-weight:600;padding:12px;text-align:left;font-family:inherit}
.dmini{height:34px;padding:0 12px;border-radius:8px;border:1px solid #D0D5DD;background:#FFF;color:#344054;font-size:13px;font-weight:600;display:flex;align-items:center;text-decoration:none;flex-shrink:0;font-family:inherit}
.dinput{height:46px;border:1px solid #D0D5DD;border-radius:10px;padding:0 12px;font-size:16px;font-family:inherit;width:100%;box-sizing:border-box;color:#101828;background:#FFF}
.dlab{font-size:13px;font-weight:600;color:#475467;margin-top:12px;display:block}
.dh{margin:4px 0 4px;font-size:26px;font-weight:700;letter-spacing:-.3px}
.dopt{height:48px;border-radius:12px;font-size:14px;font-weight:600;font-family:inherit}
.itabs.dtabs{background:#FFF;-webkit-backdrop-filter:none;backdrop-filter:none;border-top:1px solid #EAECF0}
.itabs.dtabs button{font-size:12px;color:#667085}
.itabs.dtabs button.on{color:#175CD3;font-weight:600}
.asbar{position:sticky;top:0;z-index:7;background:#101828;color:#FFF;font-size:13px;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px 16px}
.asbar button{border:none;background:#FFF;color:#101828;border-radius:14px;height:28px;padding:0 12px;font-size:13px;font-weight:600;font-family:inherit}

.phonein{margin-top:26px;height:56px;border-radius:12px;background:#F2F2F7;display:flex;align-items:center;gap:10px;padding:0 16px;font-size:20px}
.phonein span{color:#6C6C70}
.phonein input{border:none;outline:none;background:transparent;font:inherit;font-size:20px;flex:1;min-width:0;letter-spacing:.5px;color:#000}
.otpin{margin-top:26px;height:64px;border:none;border-radius:12px;background:#F2F2F7;text-align:center;font-size:32px;letter-spacing:12px;font-family:inherit;outline:none;width:100%;box-sizing:border-box;font-variant-numeric:tabular-nums}

/* ---- v8: one design language (the v5 look) for every screen ---- */
.wrap.i{background:#FFF;color:#101828}
.ihd{padding:calc(env(safe-area-inset-top) + 20px) 16px 4px 16px}
.ilt{font-size:24px;letter-spacing:-.3px}
.icirc{background:#F2F4F7;color:#344054}
.icard{background:#FFF;border:1px solid #EAECF0;border-radius:14px}
.isec{padding:20px 16px 8px;font-size:15px;font-weight:700;color:#101828;align-items:baseline}
.isec span:last-child{font-size:13px;font-weight:400;color:#667085}
.ilist{margin:0 16px;border:1px solid #EAECF0;border-radius:14px}
.irow{font-size:15px;padding:11px 14px;border-bottom:1px solid #F2F4F7;color:#101828}
.irow .icol>span:first-child{font-weight:600}
button.irow:active,a.irow:active{background:#F9FAFB}
.isub{color:#667085}
.ifoot{padding:8px 16px 0;color:#667085;font-size:12.5px}
.ib{height:52px;border-radius:12px;font-size:16px;color:#175CD3;border:1px solid #D0D5DD}
.ib.pri{background:#175CD3;border:none;font-weight:700}
.ib.soft{background:#EFF4FF;border:none}
.igray{height:36px;border:1px solid #D0D5DD;background:#FFF;border-radius:10px;font-size:13px;font-weight:600;color:#344054}
.ichip{border-radius:10px;font-size:14px;font-weight:600;color:#344054;border:1px solid #D0D5DD;height:40px}
.ichip.on{background:#EFF4FF;border:2px solid #175CD3;color:#175CD3}
.iseg{background:#F2F4F7;border-radius:10px;padding:3px}
.iseg button{height:34px;border-radius:8px;font-size:13px;font-weight:600;color:#667085}
.iseg button.on{color:#101828;box-shadow:0 1px 2px rgba(16,24,40,.12)}
.iround{background:#EFF4FF;color:#175CD3}
.ilink{color:#175CD3;font-size:15px}
.iback{color:#175CD3;font-size:15px}
.iact{background:#FFF;border:1px solid #EAECF0;color:#175CD3;font-weight:600}
.isearch{background:#FFF;border:1px solid #D0D5DD;height:44px;color:#667085}
.ifield{border-bottom:1px solid #F2F4F7;font-size:15px}
.ipill{height:30px}
.itabs{background:#FFF;-webkit-backdrop-filter:none;backdrop-filter:none;border-top:1px solid #EAECF0}
.itabs button{font-size:12px;color:#667085}
.itabs button.on{color:#175CD3;font-weight:600}
.itabs .badge{background:#D92D20}
.isheetbg{background:rgba(16,24,40,.45)}
.isheet{background:#FFF;border-radius:20px 20px 0 0}
.isheet .ilist{background:#FFF}
.isheet.up{animation:sheetup .24s cubic-bezier(.2,.8,.2,1)}
@keyframes sheetup{from{transform:translateY(100%)}to{transform:none}}
.itoast{top:calc(env(safe-area-inset-top) + 12px);bottom:auto;background:#101828;font-size:14px;border-radius:12px;padding:10px 14px;box-shadow:0 8px 24px rgba(16,24,40,.18);animation:toastin .2s ease-out}
@keyframes toastin{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
.tp{font-size:.48em;font-weight:700;color:#98A2B3;margin-right:3px;vertical-align:.6em;letter-spacing:0}
.qgrid{display:flex;flex-direction:column}
/* reception on a laptop: a real desk, not a phone strip */
@media (min-width:900px){
  .wrap.i.recep{max-width:1120px}
  .wrap.i.recep .content{padding:0 16px 110px}
  .qgrid{display:grid;grid-template-columns:1.15fr 1fr;grid-template-areas:"now bill" "next booked";column-gap:8px;align-items:start}
  .qa-now{grid-area:now}.qa-bill{grid-area:bill}.qa-booked{grid-area:booked}.qa-next{grid-area:next}
  .itabs .in{max-width:520px}
}

/* ---- v9: consult panel, smart bill, laptop shell ---- */
.clab{font-size:12px;font-weight:700;letter-spacing:.4px;color:#667085;text-transform:uppercase;margin-top:4px}
.nchips,.fchips{display:flex;flex-wrap:wrap;gap:6px}
.nchip{height:32px;padding:0 10px;border-radius:16px;border:1px solid #EAECF0;background:#F9FAFB;color:#344054;font-size:13px;font-weight:500;font-family:inherit}
.nchip:active{background:#EFF4FF}
.cnote{width:100%;box-sizing:border-box;border:1px solid #D0D5DD;border-radius:10px;padding:10px 12px;font:inherit;font-size:15px;line-height:1.4;resize:vertical;min-height:56px;color:#101828}
.cnote:focus,.dinput:focus{outline:2px solid #B2CCFF;border-color:#175CD3}
.fchip{height:36px;padding:0 14px;border-radius:10px;border:1px solid #D0D5DD;background:#FFF;color:#344054;font-size:14px;font-weight:600;font-family:inherit}
.fchip.on{background:#EFF4FF;border:2px solid #175CD3;color:#175CD3}
.kbd{display:none}
.hint{margin-top:12px;padding:10px 12px;border-radius:10px;background:#EFF4FF;color:#1849A9;font-size:14px;line-height:1.45}
.qa-side{display:flex;flex-direction:column}
@media (min-width:900px) and (max-width:1023px){.qgrid{grid-template-areas:"now side" "next side"}.qa-side{grid-area:side}}
/* laptop / desktop */
.dshell{min-height:100vh;background:#F9FAFB;color:#101828;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.side{position:fixed;top:0;bottom:0;left:0;width:228px;background:#FFF;border-right:1px solid #EAECF0;padding:22px 12px 16px;display:flex;flex-direction:column;box-sizing:border-box}
.sclinic{font-size:15px;font-weight:700;padding:0 10px;line-height:1.3}
.srole{font-size:13px;color:#667085;padding:2px 10px 18px}
.snav{display:flex;flex-direction:column;gap:2px}
.sitem{display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;border:none;background:none;border-radius:8px;font-size:14px;font-weight:500;color:#344054;text-align:left;font-family:inherit;position:relative;width:100%}
.sitem:hover{background:#F9FAFB}
.sitem.on{background:#EFF4FF;color:#175CD3;font-weight:600}
.sbadge{margin-left:auto;min-width:20px;height:20px;border-radius:10px;background:#F2F4F7;color:#344054;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 6px}
.skey{font-size:12px;color:#98A2B3;padding:8px 10px}
.dmain{margin-left:228px;padding:6px 20px 48px;box-sizing:border-box;min-height:100vh}
.dmain .ihd,.dmain .dpage>div:first-child{padding-top:22px !important}
.dmain.t-register>*,.dmain.t-inbox>*,.dmain.t-clinic>*{max-width:820px}
.dmain .dpage,.dmain .content{background:transparent}
.dmain .icard,.dmain .ilist,.dmain .dcard,.dmain .dtile{background:#FFF}

.ivname{font-size:20px;font-weight:700;letter-spacing:-.2px;margin-bottom:3px}
.ivsm{font-size:12.5px;color:#475467;line-height:1.55}
.ivkind{text-align:right;flex-shrink:0}.ivk{font-size:15px;font-weight:800;letter-spacing:.14em;color:#175CD3}
.ivrev{display:inline-block;margin-top:6px;font-size:11px;font-weight:700;color:#B54708;background:#FFFAEB;border:1px solid #FEDF89;border-radius:6px;padding:2px 6px}
.ivorig{font-size:11px;color:#98A2B3;margin-top:6px}
.ivmeta{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}
.ivbox{border:1px solid #EAECF0;border-radius:8px;padding:12px 14px}
.ivlab{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#667085;margin-bottom:4px}
.ivval{font-size:16px;font-weight:700;margin-bottom:2px}
.ivkv{width:100%;border-collapse:collapse;font-size:13px}.ivkv td{padding:3px 0;color:#475467}.ivkv td:last-child{text-align:right;color:#101828;font-weight:600}
.ivtb{width:100%;border-collapse:collapse;font-size:13px}
.ivtb th{background:#F2F4F7;color:#344054;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:9px 8px}
.ivtb td{padding:10px 8px;border-bottom:1px solid #EAECF0;vertical-align:top}.ivtb .r{text-align:right}
.ivtot{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;margin-top:16px}
.ivwords{font-size:13.5px;line-height:1.5}.ivnote{font-size:11.5px;color:#667085;margin-top:10px;line-height:1.5}
.ivsum td{padding:5px 0;font-size:13.5px}.ivgrand td{border-top:1.5px solid #101828;padding-top:9px !important;font-size:16px !important;font-weight:800 !important;color:#101828 !important}
.ivfoot{display:grid;grid-template-columns:1fr auto auto;gap:22px;align-items:end;margin-top:30px;padding-top:18px;border-top:1px dashed #D0D5DD}
.ivqr svg{display:block}
.ivsign{text-align:center;min-width:170px}.ivsignl{height:38px;border-bottom:1px solid #98A2B3;margin-bottom:6px}
@media (max-width:640px){.iv{padding:22px 16px}.ivtop{flex-direction:column}.ivkind{text-align:left}.ivmeta,.ivtot{grid-template-columns:1fr}.ivfoot{grid-template-columns:1fr}.ivtb{font-size:12px}.ivtb th:nth-child(3),.ivtb td:nth-child(3){display:none}}
@media print{@page{size:A4;margin:12mm}.ivbar{display:none}.ivw{background:#FFF;padding:0}.iv{box-shadow:none;max-width:none;border-radius:0;padding:0;border-top-width:5px}.ivtb th{-webkit-print-color-adjust:exact;print-color-adjust:exact}.ivmono,.iv{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

.rpw{max-width:760px}.rpwide{max-width:1100px}
.rgbar{display:flex;gap:6px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}.rgbar::-webkit-scrollbar{display:none}
.rgbar button{height:36px;padding:0 14px;border-radius:18px;border:1px solid #EAECF0;background:#FFF;font-family:inherit;font-size:14px;font-weight:600;color:#475467;white-space:nowrap;flex-shrink:0}
.rgbar button.on{background:#101828;border-color:#101828;color:#FFF}
.rkpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rkpi div{background:#FFF;border-radius:14px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:2px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.rkpi b{font-size:20px;font-weight:700;letter-spacing:-.3px}.rkpi span{font-size:13px;color:#667085}
.rsplit{font-size:13.5px;color:#667085;margin:8px 2px 0}
.rico{width:36px;height:36px;border-radius:10px;background:#EFF4FF;color:#175CD3;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rflag{min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:#FEE4E2;color:#B42318;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.rok{font-size:13px;color:#067647;font-weight:600}
.rtools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.rtool{height:34px;padding:0 12px;border-radius:9px;border:1px solid #D0D5DD;background:#FFF;color:#344054;font-family:inherit;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;text-decoration:none;white-space:nowrap}
.rtcard{padding:0 !important;overflow:hidden}
.rtwrap{overflow-x:auto}
.rtb{width:100%;border-collapse:collapse;font-size:13.5px;white-space:nowrap}
.rtb th{position:sticky;top:0;background:#F9FAFB;color:#475467;font-size:12px;font-weight:700;text-align:left;padding:10px 12px;border-bottom:1px solid #EAECF0}
.rtb td{padding:10px 12px;border-bottom:1px solid #F2F4F7;color:#101828}
.rtb .r{text-align:right}.rtb tbody tr:hover{background:#F9FAFB}
.rtb tfoot td{font-weight:700;background:#F9FAFB;border-top:1px solid #EAECF0;border-bottom:none}
.rtb td:nth-child(5),.rtb td:nth-child(4){white-space:normal;min-width:120px;max-width:300px}
.rbad{color:#B42318;font-weight:600}.rgood{color:#067647;font-weight:600}
.rlink{border:none;background:none;padding:0;color:#175CD3;font-weight:600;font-size:13.5px;font-family:inherit;text-decoration:none}

  function docPill(d) { var k = DOC[d && d.status] ? d.status : 'in'; var lab = k === 'late' ? 'Late ' + d.mins + ' min' : k === 'away' ? 'Away' + (d.until ? ' till ' + d.until : '') : DOC[k][0];
    return '<span class="pill" style="background:' + DOC[k][2] + ';color:' + DOC[k][3] + '"><span class="dot" style="background:' + DOC[k][1] + '"></span>' + esc(lab) + '</span>'; }

  // ---------------- patient live tracker ----------------
  function tracker(k) {
    var st = { d: null };

      var d = st.d;

      var en = d.lang === 'en';

      if (d.st === 's') card = [en ? "It's your turn" : 'Aapki baari aa gayi', en ? 'Please come in 🙏' : 'Andar aaiye 🙏', '#12B76A', '#FFFFFF'];
      else if (d.st === 'd') card = [en ? 'Visit done' : 'Aapka visit ho gaya', en ? 'Thank you for visiting' : 'Aane ke liye dhanyavaad', '#F2F4F7', '#101828'];

      else if (a === 2) card = [en ? 'Please come near the clinic' : 'Clinic ke paas aa jaiye', (en ? '2 ahead · ' : '2 patients aapse pehle · ') + d.eta, '#FFFAEB', '#93370D'];
      else card = [d.eta, en ? 'Relax, there is still time' : 'Aaram se aaiye, abhi time hai', '#F2F4F7', '#101828'];
      var dots = ''; for (var i = 3; i >= 0; i--) dots += '<span style="flex:1;height:6px;border-radius:3px;background:' + (d.st === 's' ? '#12B76A' : (i >= Math.min(a, 3) ? '#175CD3' : '#EAECF0')) + '"></span>';
      var docNote = d.doc && d.doc.status !== 'in' ? '<div style="margin:14px 20px 0;padding:12px 14px;border-radius:12px;background:' + DOC[d.doc.status][2] + ';color:' + DOC[d.doc.status][3] + ';font-size:14px;line-height:1.5">' + esc(d.doc.line) + '</div>' : '';
      $app.innerHTML = '<div class="wrap white">' +
        '<div style="padding:calc(env(safe-area-inset-top) + 24px) 20px 0;display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:15px;font-weight:700">' + esc(d.clinic.name) + '</div><div class="sub">' + esc(d.clinic.doctor) + '</div></div><span style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#067647"><span class="dot" style="background:#12B76A"></span>Live</span></div>' +
        '<div style="margin:24px 20px 0;border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;align-items:center;gap:6px;background:' + card[2] + ';color:' + card[3] + '"><span style="font-size:14px;font-weight:600;opacity:.85">' + (en ? 'Your token' : 'Aapka token') + '</span><span class="tok" style="font-size:64px;font-weight:800;letter-spacing:-1.5px;line-height:1">' + esc(d.tok) + '</span><span style="font-size:18px;font-weight:700;margin-top:8px;text-align:center">' + esc(card[0]) + '</span><span style="font-size:14px;opacity:.85;text-align:center">' + esc(card[1]) + '</span></div>' +

        docNote +

        '<div style="flex:1"></div>' +
        (d.st === 'w' ? '<div style="padding:16px 20px calc(env(safe-area-inset-bottom) + 24px)"><button class="btn" id="cx" style="width:100%;color:#B42318;border-color:#FDA29B">' + (en ? 'Cancel my token' : 'Token cancel karein') + '</button></div>' : '') +
        '</div>';
      var cx = document.getElementById('cx');
      if (cx) cx.onclick = function () { if (confirm(en ? 'Cancel your token?' : 'Token cancel karna hai?')) post({ action: 'track', k: k, cancel: true }).then(function (r) { st.d = r; draw(); }); };
    }
    function tick() { post({ action: 'track', k: k }).then(function (r) { st.d = r; draw(); }).catch(function () {}); }
    draw(); tick(); setInterval(tick, 12000);
  }

  // ---------------- waiting room TV ----------------

    }

      on('[data-vst]', function (el) { S.sheet.st = el.getAttribute('data-vst'); draw(); });
      on('[data-vmin]', function (el) { S.sheet.mins = Number(el.getAttribute('data-vmin')); draw(); });

<script type="text/plain" id="cd8-css">/* Clinic Desk — working app styles (approved v3 look) */
*{box-sizing:border-box}
html,body{margin:0;background:#F6F2EA;color:#16213A;font-family:'IBM Plex Sans','IBM Plex Sans Devanagari',system-ui,sans-serif;font-size:17px;line-height:1.45}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:#16213A}
a{color:var(--a)}
.serif{font-family:'Newsreader',Georgia,serif}
.app-reception{--a:#1F3A68;--ad:#16213A;--at:#E3EAF5;--al:#C9D3E3;--as:#F2F6FC}
.app-doctor{--a:#1E5B46;--ad:#15402F;--at:#E3EFE8;--al:#C5DBCF;--as:#F1F7F3}
.app-owner{--a:#8A6A1F;--ad:#6E5418;--at:#F3E9D2;--al:#E2D2AA;--as:#FBF5E7}
.app-patient{--a:#0F6B66;--ad:#0A4F4B;--at:#DFF0EE;--al:#B8DAD5;--as:#EFF8F6}
.app-admin{--a:#16213A;--ad:#0B1222;--at:#EEF0F4;--al:#D3D8E2;--as:#F5F6F9}

/* demo bar */
.demo{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 16px;background:#16213A;color:#C9D0DC;font-size:14px}
.demo b{color:#FFFFFF;letter-spacing:.5px}
.demo .pill{height:32px;padding:0 12px;border-radius:16px;border:1px solid #3A4458;background:transparent;color:#E6EAF1;font-size:14px}
.demo .pill.on{background:#FFFFFF;color:#16213A;border-color:#FFFFFF;font-weight:600}
.demo .sp{flex:1}
.demo select{height:32px;border-radius:16px;border:1px solid #3A4458;background:#16213A;color:#E6EAF1;padding:0 10px;font-size:14px}

/* app chrome */
.hdr{display:flex;align-items:center;gap:14px;padding:16px 40px;background:#FFFFFF;border-bottom:1px solid #E2DACB;flex-wrap:wrap}
.hdr .nm{font-size:23px;font-weight:600}
.hdr .who{color:#5B6474}
.hdr .sp{flex:1}
.hdr .sw-link{background:none;border:0;color:var(--a);font-weight:600;font-size:16px}
.logo{width:36px;height:36px;border-radius:18px;border:2px solid var(--brand,#8A6A1F);color:var(--brand,#8A6A1F);display:inline-flex;align-items:center;justify-content:center;font-family:'Newsreader',serif;font-weight:600;font-size:19px;flex:none}
main.pg{max-width:1180px;margin:0 auto;padding:30px 40px 60px;display:flex;flex-direction:column;gap:22px}
main.pg.narrow{max-width:860px}
main.pg.mid{max-width:1060px}
h1.t{margin:0;font-family:'Newsreader',Georgia,serif;font-size:36px;font-weight:600;line-height:1.15}
h2.t{margin:0;font-family:'Newsreader',Georgia,serif;font-size:26px;font-weight:600}
.muted{color:#5B6474}
.small{font-size:15px}
.card{background:#FFFFFF;border:1px solid #E2DACB;border-radius:14px}
.soft{background:var(--as);border-color:var(--al)}
.pad{padding:20px 24px}
.btn{height:52px;padding:0 22px;border-radius:12px;border:0;background:var(--a);color:#FFFFFF;font-weight:600;font-size:17px;white-space:nowrap}
.btn:hover{background:var(--ad)}
.btn.big{height:62px;font-size:19px}
.btn.full{width:100%}
.btn.green{background:#24563A}
.btn.red{background:#A3271F}
.btn:disabled{background:#B9B3A7;cursor:not-allowed}
.ghost{height:52px;padding:0 20px;border-radius:12px;border:1.5px solid var(--al);background:#FFFFFF;color:var(--a);font-weight:600;font-size:17px;white-space:nowrap}
.ghost:hover{border-color:var(--a)}
.ghost.sm,.btn.sm{height:42px;font-size:15px;padding:0 14px}
.back{background:none;border:0;color:var(--a);font-weight:600;font-size:17px;padding:6px 0;align-self:flex-start}
.txt{background:none;border:0;color:var(--a);font-weight:500;font-size:16px;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.tile{text-align:left;border:1px solid #E2DACB;background:#FFFFFF;border-radius:18px;padding:26px 26px 22px;display:flex;flex-direction:column;gap:10px;min-height:186px;transition:border-color .15s,box-shadow .15s,transform .15s}
.tile:hover{border-color:var(--a);box-shadow:0 6px 20px rgba(22,33,58,.10);transform:translateY(-1px)}
.tile .ic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600}
.tile .tt{font-size:23px;font-weight:600}
.tile .sb{font-size:17px;color:#5B6474}
.choices{display:flex;flex-wrap:wrap;gap:12px}
.choice{min-height:54px;border-radius:12px;border:1.5px solid #D8D0C0;background:#FFFFFF;color:#16213A;font-size:17px;font-weight:500;padding:0 18px}
.choice:hover{border-color:var(--a)}
.choice.on{border-color:var(--a);background:var(--at);color:var(--a);font-weight:600}
.choice.sm{min-height:46px;font-size:16px;padding:0 14px}
.field{height:56px;border-radius:12px;border:1.5px solid #D8D0C0;background:#FFFFFF;padding:0 16px;font-size:18px;outline:none;width:100%}
textarea.field{height:auto;min-height:96px;padding:12px 16px;line-height:1.45;resize:vertical}
.field:focus{border-color:var(--a)}
.field.err{border-color:#A3271F}
.flbl{font-size:15px;color:#5B6474;margin-bottom:8px;display:block}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.row{display:flex;align-items:center;gap:18px;padding:15px 0;border-bottom:1px solid #EEE7DA}
.row:last-child{border-bottom:0}
.list-card{display:flex;align-items:center;gap:20px;padding:18px 24px}
.tok{width:78px;font-size:23px;font-weight:700;color:var(--a);flex:none}
.nm2{font-size:20px;font-weight:600}
.flex{display:flex;align-items:center;gap:14px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.right{text-align:right}
.ok{color:#24563A}.warn{color:#8A5A00}.bad{color:#8E2A22}
.big-num{font-size:56px;font-weight:700;line-height:1.05}
.badge{display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:14px;font-size:14px;font-weight:600}
.b-ok{background:#E8EFE9;color:#24563A}.b-warn{background:#F3E6CC;color:#6B4300}.b-bad{background:#F6E1DF;color:#8E2A22}.b-a{background:var(--at);color:var(--a)}.b-ink{background:#16213A;color:#FFFFFF}
.stamp{display:inline-block;white-space:nowrap;font-weight:700;letter-spacing:2px;text-transform:uppercase;border:2.5px solid currentColor;border-radius:6px;padding:3px 10px;transform:rotate(-5deg)}
.sw{width:54px;height:30px;border-radius:15px;background:var(--a);position:relative;flex:none;border:0;padding:0}
.sw::after{content:'';position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:11px;background:#FFFFFF;transition:all .15s}
.sw.off{background:#D8D0C0}.sw.off::after{right:28px}
.link{height:46px;border-radius:23px;border:1.5px solid #D8D0C0;background:#FFFFFF;color:#16213A;font-size:16px;padding:0 18px}
.link:hover{border-color:var(--a);color:var(--a)}
.banner{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 22px;border-radius:14px;background:#FFF4DC;border:1px solid #EBCB85;color:#5C4300}
.empty{padding:36px;text-align:center;color:#5B6474}
.search-res{position:relative}
.search-drop{position:absolute;left:0;right:0;top:6px;z-index:5;background:#FFFFFF;border:1px solid #D8D0C0;border-radius:14px;box-shadow:0 14px 30px rgba(22,33,58,.12);overflow:hidden}
.search-drop button{display:flex;width:100%;gap:14px;align-items:center;text-align:left;background:#FFFFFF;border:0;border-bottom:1px solid #EEE7DA;padding:14px 20px}
.search-drop button:hover{background:var(--as)}
.bar{height:14px;border-radius:7px;background:#F1EADA;flex:1}
.bar i{display:block;height:14px;border-radius:7px;background:var(--a)}
.vbars{display:flex;align-items:flex-end;gap:18px;height:160px;padding-top:10px}
.vbars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%}
.vbars .col i{display:block;width:100%;max-width:70px;border-radius:8px 8px 0 0;background:var(--a)}

/* train */
.train{display:flex;align-items:flex-end;gap:10px;overflow:hidden}
.coach{position:relative;width:104px;height:62px;border-radius:12px 12px 6px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex:none;line-height:1.15;background:#FFFFFF;border:1.5px solid var(--al)}
.coach small{font-size:12px;font-weight:500}
.coach::before,.coach::after{content:'';position:absolute;bottom:-9px;width:15px;height:15px;border-radius:8px;background:#16213A;border:3px solid #FFFFFF}
.coach::before{left:16px}.coach::after{right:16px}
.coach.you{background:var(--a);color:#FFFFFF;border-color:var(--a)}
.coach.eng{width:168px;height:78px;background:#16213A;color:#FFFFFF;border-color:#16213A;border-radius:12px 26px 6px 6px}
.coach.eng.out{background:#8A5A00;border-color:#8A5A00}
.track{height:3px;background:#C9BFAE;margin-top:12px;border-radius:2px}
@keyframes chug{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.coach.eng{animation:chug 1.4s ease-in-out infinite}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(22,33,58,.45);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:60px 20px;overflow:auto}
.modal{background:#FFFFFF;border-radius:18px;max-width:620px;width:100%;padding:28px 30px;display:flex;flex-direction:column;gap:16px;box-shadow:0 30px 60px rgba(0,0,0,.2)}
.modal.wide{max-width:820px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:90;background:#16213A;color:#FFFFFF;padding:14px 22px;border-radius:14px;font-size:16px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:90vw;display:flex;gap:12px;align-items:center}
.toast .wa{display:inline-flex;width:24px;height:24px;border-radius:12px;background:#25A35A;align-items:center;justify-content:center;font-size:13px}

/* receipt / rx paper */
.paper{background:#FFFDF8;border:1px solid #E2DACB;border-radius:12px;padding:26px 28px;position:relative}
.paper .tear{position:absolute;left:0;right:0;bottom:-1px;height:10px;background:radial-gradient(circle at 6px 10px,#FFFFFF 5px,transparent 6px) 0 0/12px 10px repeat-x}
.dash{border-top:1px dashed #C9BFAE}
.sig{font-family:'Caveat',cursive;font-size:30px;color:var(--a)}

/* phone frame for patient */
.phone-stage{display:flex;justify-content:center;gap:40px;padding:30px 20px 60px;flex-wrap:wrap;align-items:flex-start}
.phone{width:390px;min-height:780px;background:#F6F2EA;border-radius:36px;border:10px solid #16213A;overflow:hidden;box-shadow:0 30px 60px rgba(22,33,58,.25);display:flex;flex-direction:column;font-size:16px}
.phone .ph-h{display:flex;align-items:center;gap:10px;padding:16px 18px;background:#FFFFFF;border-bottom:1px solid #E2DACB}
.phone main{padding:18px;display:flex;flex-direction:column;gap:16px}
.phone .tile{min-height:120px;padding:16px;border-radius:16px;gap:6px}
.phone .tile .ic{width:40px;height:40px;font-size:18px;border-radius:12px}

  const SC = {};
  CD.apps.doctor = { screens: SC };

  /* follow-ups due */
  function followDue(docId) {
    const c = C(), s = S();
    const latest = {};
    c.rx.forEach(r => { if (!latest[r.pid] || latest[r.pid].date < r.date) latest[r.pid] = r; });
    const lastV = {}; c.visits.forEach(v => { if (v.status !== 'left' && (!lastV[v.pid] || lastV[v.pid] < v.date)) lastV[v.pid] = v.date; });
    const future = new Set(c.appts.filter(a => a.date >= s.today).map(a => a.pid));
    return Object.values(latest).filter(r => r.doc === docId && r.follow && r.follow <= CD.addDays(s.today, 7) && !(lastV[r.pid] > r.date) && !future.has(r.pid))
      .map(r => ({ r, p: CD.P(r.pid), late: CD.daysAgo(r.follow) }))
      .filter(x => x.p && !x.p.merged)
      .sort((a, b) => b.late - a.late);
  }

  /* ================= HOME ================= */
  SC.home = function () {
    const c = C(), s = S(), d = me();

      : '<section class="card soft pad flex wrap"><span class="grow" style="font-size:20px">No one is waiting for you right now.</span>' + (d.status === 'in' ? '<button class="ghost" data-a="nav" data-v="out">Step out for a while</button>' : '') + '</section>';

      CD.tile('follow', String(fu.length), 'Follow-ups due', late ? late + ' are late by over a month' : (fu.length ? 'All recent' : 'None due'), '#F3E6CC', '#6B4300', late ? 'warn' : ''),
      CD.tile('reports', String(reps.length), 'New reports', reps.length ? CD.first(CD.P(reps[0].pid).name) + ' sent ' + reps[0].name.toLowerCase() : 'Nothing new', reps.length ? '#F6E1DF' : '#E8EFE9', reps.length ? '#8E2A22' : '#24563A', reps.length ? 'bad' : '')

      '<div class="flex wrap" style="justify-content:center;gap:10px"><span class="muted">More:</span>' + [['search', 'Search patients'], ['photos', 'Before / after photos'], ['earn', 'My earnings'], ['letter', 'Letterhead']].map(([k, l]) => '<button class="link" data-a="nav" data-v="' + k + '">' + l + '</button>').join('') + '</div>' +
      '<p class="muted" style="margin:0;text-align:center;font-size:16px">Today: ' + seen.length + ' seen · ' + wait.length + ' waiting · average ' + avg + ' min per patient</p></main>';
  };
  A.startConsult = function (ds) {
    const d = me();

  R.wres = () => { const q = (UI.f.wq || '').toLowerCase(); if (q.length < 2) return '<div class="muted small">Type at least 2 letters.</div>'; const dig = q.replace(/\D/g, ''); return C().patients.filter(p => !p.merged && (p.name.toLowerCase().includes(q) || (dig.length > 2 && p.phone.includes(dig)))).slice(0, 6).map(p => '<button class="card" style="width:100%;text-align:left;padding:12px 16px;margin-top:8px" data-a="walkPick" data-id="' + p.id + '"><strong>' + esc(p.name) + '</strong> <span class="muted small">' + (CD.as(p) ? esc(CD.as(p)) + ' · ' : '') + CD.mask(p.phone) + '</span></button>').join('') || '<div class="muted small">No one found. Ask reception to register them.</div>'; };

      '<div class="grid3" style="grid-template-columns:1fr 1fr 2fr"><div><span class="flbl">Weight (kg)</span><input class="field" inputmode="decimal" data-f="wt" value="' + esc(f.wt) + '"></div><div><span class="flbl">BP</span><input class="field" data-f="bp" value="' + esc(f.bp) + '" placeholder="120/80"></div><div><span class="flbl">Tests advised (comma between)</span><input class="field" data-f="tests" value="' + esc(f.tests) + '" placeholder="e.g. CBC, Thyroid profile"></div></div>' +

      '<div><span class="flbl">Advice</span><input class="field" data-f="advice" value="' + esc(f.advice) + '" placeholder="e.g. Wash face twice a day. Don\'t squeeze. Sunscreen in the day."></div>' +
      '<div><span class="flbl">See ' + pron(p) + ' again</span>' + CD.choices('follow', [['14', '2 weeks'], ['28', '4 weeks'], ['42', '6 weeks'], ['0', 'Only if needed']], f.follow) + '</div>' +
      '<div class="flex wrap" style="padding-top:6px"><span class="sig grow" style="white-space:nowrap">' + esc(d.name) + '</span><button class="ghost" data-a="printRx">Print</button><button class="ghost" data-a="saveAsSet">Save as a set</button><button class="btn big" data-a="finishRx">Finish and send Rx on WhatsApp</button></div><div id="rx-err" class="bad small"></div></section>';
    return hdr() + '<main class="pg">' + CD.backBtn() + '<div class="flex wrap" style="align-items:flex-start;gap:24px">' + aside + main + '</div></main>';

  R.meds = function () {

  };

  A.repeatRx = ds => { const r = C().rx.find(x => x.id === ds.id); UI.f.meds = r.meds.map(m => Object.assign({}, m)); UI.f.finding = UI.f.finding || r.finding; UI.f.advice = UI.f.advice || r.advice; syncText(); CD.render(); };
  function syncText() { document.querySelectorAll('[data-f]').forEach(el => { if (el.dataset.f && el.type !== 'checkbox') UI.f[el.dataset.f] = el.value; }); }
  const rxPrintHtml = (p, r, d) => { const c = C(); return '<div style="max-width:640px"><div style="display:flex;justify-content:space-between;border-bottom:2px solid #1E5B46;padding-bottom:10px"><div><h1>' + esc(c.name) + '</h1><div style="color:#555">' + esc(c.timings) + '</div></div><div style="text-align:right"><strong>' + esc(d.name) + '</strong><br><span style="color:#555">' + esc(d.deg || 'MBBS, MD (Dermatology)') + '<br>Reg. no. ' + esc(d.reg || 'DMC/R/48213') + '</span></div></div><p><strong>' + esc(p.name) + '</strong> · ' + (CD.as(p) ? esc(CD.as(p)) + ' · ' : '') + CD.d(r.date) + '</p><p><strong>Diagnosis:</strong> ' + esc(r.finding) + '</p><p style="font-size:22px;font-family:Newsreader,serif;margin:12px 0 4px">Rx</p><table>' + r.meds.map((m, i) => '<tr><td>' + (i + 1) + '.</td><td><strong>' + esc(m.n) + '</strong></td><td>' + esc(m.how) + '</td></tr>').join('') + '</table>' + (r.advice ? '<p><strong>Advice:</strong> ' + esc(r.advice) + '</p>' : '') + (r.follow ? '<p><strong>Next visit:</strong> ' + CD.day(r.follow) + '</p>' : '') + '<div style="text-align:right;margin-top:30px"><span class="sig" style="color:#1E5B46">' + esc(d.name) + '</span></div></div>'; };

  docs.rx = function (p, r, d) {

    const meds = '<ol>' + lines.map((l, i) => { const ins = instr(r.meds[i], lang); return '<li><div class="m2"><span class="m1">' + esc(l.form) + ' <b>' + esc(l.gen) + '</b>' + (l.strength ? ' ' + esc(l.strength) : '') + (l.brand ? ' <span class="br">(' + esc(l.brand) + ')</span>' : '') + '</span><span class="br" style="font-size:9.5px;white-space:nowrap">' + esc(l.qty ? 'Qty ' + l.qty : '') + '</span></div>' +

      '<div class="h">Dx</div><div><b>' + esc(r.finding || '—') + '</b></div>' +
      ((r.tests && r.tests.length) ? '<div class="h">Inv. advised</div><div>' + r.tests.map(t => '• ' + esc(t)).join('<br>') + '</div>' : '') +
      '<div class="h">Allergy</div><div>' + esc(p.allergies || 'NKDA') + '</div></div>';

      '<div class="sm" style="font-size:9.5px;color:#3A4458;margin-top:2px">' + (lang === 'en' ? 'Reply 1 on WhatsApp to book' : 'Booking ke liye WhatsApp par 1 likhein') + ' · ' + esc(p.id ? CD.link(p.id) : '') + '</div>';
    const sign = '<div class="sg"><div style="text-align:right"><div class="sig">' + esc(d.name) + '</div><div style="border-top:1px solid #16213A;padding-top:2px;font-size:9px"><b>' + esc(d.name) + '</b><br>Reg. No. ' + esc(d.reg || '—') + '</div></div></div>';
    const top = '<div class="top"><div><div class="dn">' + esc(d.name) + '</div><div class="dd">' + esc(d.deg || 'MBBS') + '</div><div class="dm">' + esc(d.spec ? 'Consultant ' + ({ Skin: 'Dermatologist', Hair: 'Trichologist' }[d.spec] || d.spec) : '') + '<br>Reg. No. ' + esc(d.reg || '—') + ' (' + esc(d.council || '') + ')</div></div>' +
      '<div class="cl"><b>' + esc(c.name) + '</b><br>' + esc(c.timings || '') + '<br>☎ ' + esc(c.phone || '') + '</div></div><div class="band"></div><div class="band2"></div>';
    const pline = '<div class="pl"><span>Name: <span class="u" style="min-width:120px">' + esc(p.name) + '</span></span><span>Age/Sex: <span class="u">' + esc(CD.age(p).replace(' y', '')) + '/' + esc(p.sex || '') + '</span></span><span>Date: <span class="u">' + dmy(r.date) + '</span></span></div>' +
      '<div class="pl" style="color:#3A4458;font-size:10px"><span>UHID: <b>' + esc(CD.uhid(p)) + '</b></span><span>Ph: ' + (p.phone ? CD.phoneFmt(p.phone) : '—') + '</span></div>';
    const main = '<div class="main"><div class="rx">℞</div>' + meds + adv + sign + '</div>';
    const foot = '<div class="ft"><span>' + esc(c.address || '') + '</span><span>Generic names as per NMC · Not valid for medico-legal purposes</span></div>';
    return page('A5') + PAD + '<div class="pad">' + top + pline + '<div class="body">' + side + main + '</div>' + foot + '</div>';
  };
  CD.rxPrintHtml = docs.rx;

  /* ---------------- RECEIPT (A5) ---------------- */
  const SAC = it => it.cat === 'medicine' ? 'HSN 3004' : it.cat === 'consult' ? 'SAC 999312' : (it.gst ? 'SAC 999722' : 'SAC 999312');
  const ref = b => { let h = 7; String(b.no).split('').forEach(ch => { h = (h * 131 + ch.charCodeAt(0)) % 1e12; }); return String(h).padStart(12, '4'); };
  docs.receipt = function (b) {
    const c = C(), p = CD.P(b.pid) || { name: '' };
    let gstTotal = 0;
    const rows = b.items.map(it => { const r = it.gst || 0; const base = r ? it.amt / (1 + r / 100) : it.amt; gstTotal += it.amt - base; return '<tr><td>' + esc(it.n) + '<div class="sm mut">' + SAC(it) + (r ? ' · GST ' + r + '%' : ' · exempt') + '</div></td><td class="num">' + rs(base) + '</td></tr>'; }).join('');

    const body = '<div style="display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:10px"><div style="font-size:12px;line-height:1.6">Received with thanks from <b>' + esc(p.name) + '</b> (UHID ' + esc(CD.uhid(p)) + ')<br>the sum of <b>Rupees ' + CD.words(b.total) + ' Only</b> (' + rs(b.total) + ')<br>by <b>' + esc(pay) + '</b></div>' + stamp + '</div>' +
      '<table><thead><tr><th>Towards</th><th class="num">₹</th></tr></thead><tbody>' + rows +
      (b.discount ? '<tr><td>Concession</td><td class="num">− ' + rs(b.discount) + '</td></tr>' : '') +
      (gstTotal > 0.5 ? '<tr><td>CGST 9%</td><td class="num">' + rs(gstTotal / 2) + '</td></tr><tr><td>SGST 9%</td><td class="num">' + rs(gstTotal / 2) + '</td></tr>' : '') +
      '<tr class="tot"><td>Total paid</td><td class="num" style="font-size:14px">' + rs(b.total) + '</td></tr></tbody></table>' +
      (b.refund ? '<div class="bad" style="margin-top:6px">Refunded ' + rs(b.refund.amt) + ' on ' + CD.d(b.refund.date) + ' · ' + esc(b.refund.reason) + '</div>' : '');
    const foot = '<div class="foot"><span>Computer-generated receipt, no signature needed. Consultations are exempt from GST.' + (c.gstin ? ' GSTIN ' + esc(c.gstin) : '') + '</span><span>Received by ' + esc(b.by || 'Reception') + '</span></div>';
    return page('A5') + CSS + '<div class="doc a5" style="--k:#16213A;--t:#F2F6FC">' + head(c, right) + body + foot + '</div>';
  };

  /* ---------------- TOKEN SLIP (80 mm) ---------------- */
  docs.token = function (v) {
    const c = C(), p = CD.P(v.pid) || {}; const d = CD.doc(v.doc);
    const ahead = CD.waiting(v.doc).filter(x => CD.tokN(x) < CD.tokN(v)).length + (CD.inCabin(v.doc) ? 1 : 0);
    return '<style>@page{size:80mm 120mm;margin:4mm}</style>' + CSS + '<div class="doc" style="max-width:290px;text-align:center;--k:#1F3A68"><div style="font-family:Newsreader,serif;font-size:16px;font-weight:600">' + esc(c.name) + '</div><div class="sm mut">' + esc(CD.day(v.date)) + ' · ' + CD.t(v.time) + '</div><div style="border-top:1px dashed #999;margin:8px 0"></div><div class="lab">Token · टोकन</div><div style="font-size:64px;font-weight:700;line-height:1">' + esc(v.tok) + '</div><div style="font-size:13px;font-weight:600;margin-top:4px">' + esc(p.name) + '</div><div class="sm">' + esc(d.name) + '</div><div style="margin:8px 0;font-size:12px"><b>' + ahead + '</b> before you · आपसे पहले <b>' + ahead + '</b> लोग</div><div class="sm mut">Track your turn on WhatsApp:<br>' + esc(CD.link(p.id)) + '</div><div style="border-top:1px dashed #999;margin:8px 0"></div><div class="sm">Please keep this slip · कृपया यह पर्ची रखें</div></div>';
  };

  /* ---------------- OPD REGISTER (A4 landscape) ---------------- */
  docs.register = function (date) {
    const c = C(), s = S(); date = date || s.today;
    const vs = c.visits.filter(v => v.date === date && v.tok && v.tok !== 'Rx').sort((a, b) => CD.tokN(a) - CD.tokN(b));
    const isOld = v => c.visits.some(x => x.pid === v.pid && x.date < date);
    const rows = vs.map(v => { const p = CD.P(v.pid) || {}; const b = v.bill ? c.bills.find(x => x.no === v.bill) : null; const rx = c.rx.find(r => r.pid === v.pid && r.date === date);
      return '<tr' + (v.status === 'left' ? ' class="strike"' : '') + '><td class="b">' + esc(v.tok) + '</td><td class="mut">' + esc(CD.uhid(p)) + '</td><td>' + CD.tShort(v.time) + '</td><td class="b">' + esc(p.name || '') + (p.rel ? '<div class="sm mut" style="font-weight:400">' + esc(p.rel) + '</div>' : '') + '</td><td>' + esc(CD.age(p)) + ' / ' + esc(p.sex || '') + '</td><td>' + CD.mask(p.phone) + '</td><td>' + (isOld(v) ? 'Old' : '<b>New</b>') + '</td><td>' + esc(CD.doc(v.doc).short) + '</td><td>' + esc(rx ? rx.finding : (p.problem || '')) + '</td><td class="num">' + (b ? rs(b.total) : '—') + '</td><td>' + (b ? esc(b.mode) : v.status === 'booked' ? 'Not arrived' : CD.feeItems(v.pid, v.kind, v.tr).length && !(v.status === 'done' && v.date < S().today) ? '<span class="bad">Unpaid</span>' : 'Free follow-up') + '</td><td>' + esc(v.status === 'done' ? 'Seen' : v.status === 'cabin' ? 'With doctor' : v.status === 'left' ? 'Left' : v.status === 'booked' ? 'Booked' : 'Waiting') + '</td></tr>'; }).join('');
    const tot = vs.reduce((x, v) => { const b = v.bill ? c.bills.find(y => y.no === v.bill) : null; return x + (b ? CD.netOf(b) : 0); }, 0);
    const nNew = vs.filter(v => !isOld(v)).length;
    const right = '<div style="font-size:14px;font-weight:700">OPD Register</div><div class="mut sm">' + CD.day(date) + ' ' + date.slice(0, 4) + '</div><div class="sm">' + vs.length + ' patients · ' + nNew + ' new · ' + (vs.length - nNew) + ' old</div>';
    return page('A4 landscape') + CSS + '<div class="doc" style="max-width:none;--k:#1F3A68;--t:#F2F6FC">' + head(c, right) + '<table><thead><tr><th>OPD no.</th><th>UHID</th><th>Time</th><th>Patient</th><th>Age / Sex</th><th>Phone</th><th>New / Old</th><th>Doctor</th><th>Complaint / Diagnosis</th><th class="num">Fee</th><th>Mode</th><th>Status</th></tr></thead><tbody>' + rows + '<tr class="tot"><td colspan="9">Total collected from OPD</td><td class="num">' + rs(tot) + '</td><td colspan="2"></td></tr></tbody></table><div class="g2"><div class="sigline">Reception</div><div class="sigline">Doctor</div></div></div>';
  };

  /* ---------------- money helpers ---------------- */
  const net = bs => bs.reduce((x, b) => x + CD.netOf(b), 0);
  const fullRef = b => b.refund && b.refund.amt === b.total;
  const catSum = (bs, k) => bs.reduce((x, b) => x + (fullRef(b) ? 0 : b.items.filter(i => i.cat === k).reduce((y, i) => y + i.amt, 0)), 0);
  const gstOf = bs => bs.reduce((x, b) => x + (fullRef(b) ? 0 : b.items.reduce((y, i) => y + (i.gst ? i.amt - i.amt / (1 + i.gst / 100) : 0), 0)), 0);
  const pct = (a, b) => b ? Math.round((a - b) / b * 100) : 0;
  const delta = (a, b, label) => { if (!b) return '<span class="mut">No data for ' + label + '</span>'; const d = a - b; if (Math.abs(pct(a, b)) < 1) return '<span class="mut">Same as ' + label + '</span>'; return '<span class="' + (d >= 0 ? 'ok' : 'bad') + '">' + (d >= 0 ? '▲ ' : '▼ ') + rs(Math.abs(d)) + ' (' + Math.abs(pct(a, b)) + '%)</span> <span class="mut">vs ' + label + '</span>'; };
  const barRow = (label, v, max, sub, neg) => '<tr><td style="width:40%">' + esc(label) + (sub ? '<div class="sm mut">' + esc(sub) + '</div>' : '') + '</td><td><div class="bar' + (neg || v < 0 ? ' neg' : '') + '"><i style="width:' + (max ? Math.max(2, Math.round(Math.abs(v) / max * 100)) : 0) + '%"></i></div></td><td class="num" style="width:22%;font-weight:600' + (v < 0 ? ';color:#A3271F' : '') + '">' + rs(v) + '</td></tr>';
  const vdMap = () => { const m = {}; C().visits.forEach(v => { m[v.pid + v.date] = v.doc; }); return m; };
  const fromBot = p => p && /WhatsApp|Missed/.test(p.source || '');

  /* ---------------- DAY REPORT ---------------- */
  docs.daily = function (date) {
    const c = C(), s = S(); date = date || s.today;
    const bills = c.bills.filter(b => b.date === date).sort((a, b) => a.time - b.time);
    const lastWk = c.bills.filter(b => b.date === CD.addDays(date, -7));
    const tot = net(bills);
    const mode = m => { const bs = bills.filter(b => b.mode === m); return [net(bs), bs.length]; };
    const cd = c.cashDays.find(x => x.date === date);
    const closedAt = date === s.today ? s.dayClosed[c.id] : (cd ? 1215 : null);
    const vis = c.visits.filter(v => v.date === date);
    const seen = vis.filter(v => v.status === 'done'), left = vis.filter(v => v.status === 'left');
    const isOld = v => c.visits.some(x => x.pid === v.pid && x.date < date);
    const refunds = bills.filter(b => b.refund);
    const petty = (c.expenses || []).filter(x => x.date === date && x.from === 'drawer');
    const pettyT = petty.reduce((x, e) => x + e.amt, 0);
    const float = c.float || 0;
    const cashIn = mode('Cash')[0];
    const shouldBe = float + cashIn - pettyT;
    const vd = vdMap();
    const payouts = c.doctors.filter(d => d.visiting).map(d => { const v = net(bills.filter(b => vd[b.pid + b.date] === d.id)); return [d, v, Math.round(v * (d.share || .5))]; }).filter(x => x[1] > 0);
    const dues = vis.filter(v => !v.bill && v.status !== 'left' && v.status !== 'booked' && CD.feeItems(v.pid, v.kind, v.tr).length);
    const conc = bills.filter(b => b.discount);
    const bot = bills.filter(b => fromBot(CD.P(b.pid)));
    const right = '<div style="font-size:14px;font-weight:700">Day report</div><div class="mut sm">' + CD.day(date) + ' ' + date.slice(0, 4) + '</div><div class="sm ' + (closedAt ? 'ok' : 'mut') + '">' + (closedAt ? 'Closed by ' + esc(cd ? cd.by : CD.meName()) + (date === s.today ? ' at ' + CD.t(closedAt) : '') : 'Not closed yet · printed ' + CD.t(s.clock)) + '</div>';
    const spot = '<div class="box tint" style="display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding:13px 16px"><div><div class="lab">Net collected today</div><div class="big">' + rs(tot) + '</div><div class="sm" style="margin-top:4px">' + delta(tot, net(lastWk), 'last ' + CD.day(date).split(' ')[0]) + '</div></div><div class="sm" style="text-align:right;line-height:1.7">' + bills.length + ' bills · ' + seen.length + ' patients seen<br><span class="ok b">' + rs(net(bot)) + '</span> from WhatsApp / missed-call patients</div></div>';
    const modes = '<div class="g3" style="margin-top:9px">' + ['Cash', 'UPI', 'Card'].map(m => { const [v, n] = mode(m); return '<div class="box"><div class="lab">' + m + '</div><div class="mid">' + rs(v) + '</div><div class="sm mut">' + n + ' bill' + (n === 1 ? '' : 's') + ' · ' + (tot ? Math.round(v / tot * 100) : 0) + '%</div></div>'; }).join('') + '</div>';
    const cashbook = '<div class="box avoid"><div class="lab">Cash book</div><table>' +
      '<tr><td>Opening change in drawer</td><td class="num">' + rs(float) + '</td></tr>' +
      '<tr><td>+ Cash taken today</td><td class="num">' + rs(cashIn) + '</td></tr>' +
      '<tr><td>− Spent from drawer' + (petty.length ? '<div class="sm mut">' + esc(petty.map(e => e.what + ' ' + rs(e.amt)).join(' · ')) + '</div>' : '') + '</td><td class="num">' + (pettyT ? '− ' + rs(pettyT) : '–') + '</td></tr>' +
      '<tr class="tot"><td>Should be in drawer</td><td class="num">' + rs(shouldBe) + '</td></tr>' +
      (cd ? '<tr><td>Counted by ' + esc(cd.by) + '</td><td class="num">' + rs(cd.counted) + '</td></tr>' : '') + '</table>' +
      '<div style="margin-top:7px;display:flex;justify-content:space-between;align-items:center;gap:8px">' + (cd ? (cd.diff === 0 ? '<span class="stamp ok">Matched</span>' : '<span class="stamp bad">' + (cd.diff < 0 ? 'Short ' : 'Extra ') + rs(Math.abs(cd.diff)) + '</span>') + '<span class="sm" style="text-align:right">Hand to owner <b>' + rs(cd.handed != null ? cd.handed : Math.max(0, cd.counted - float)) + '</b><br><span class="mut">keep ' + rs(float) + ' change</span></span>' : '<span class="sm mut">Not counted yet — count in "Close the day".</span>') + '</div></div>';
    const pts = '<div class="box avoid"><div class="lab">Patients</div><table><tr><td>Seen</td><td class="num b">' + seen.length + '</td></tr><tr><td>New · Old</td><td class="num">' + seen.filter(v => !isOld(v)).length + ' · ' + seen.filter(isOld).length + '</td></tr><tr><td>Procedures done</td><td class="num">' + seen.filter(v => v.kind === 'proc').length + '</td></tr>' +
      c.doctors.map(d => [d.short, vis.filter(v => v.doc === d.id && v.status === 'done').length]).filter(x => x[1]).map(([n, v]) => '<tr><td>' + esc(n) + '</td><td class="num">' + v + '</td></tr>').join('') +
      '<tr><td>Left without seeing doctor</td><td class="num ' + (left.length ? 'bad' : '') + '">' + left.length + '</td></tr><tr><td>Still waiting</td><td class="num">' + vis.filter(v => v.status === 'waiting' || v.status === 'cabin').length + '</td></tr></table></div>';

      '<div class="box"><div class="lab">Visiting doctor payout</div>' + (payouts.length ? payouts.map(([d, v, sh]) => '<div style="display:flex;justify-content:space-between;gap:6px"><span>' + esc(d.short) + ' · ' + Math.round((d.share || .5) * 100) + '% of ' + rs(v) + '</span><b>' + rs(sh) + '</b></div>').join('') : '<div class="mut">None</div>') + '</div>' +
      '<div class="box"><div class="lab">Concessions given</div>' + (conc.length ? conc.map(b => '<div style="display:flex;justify-content:space-between;gap:6px"><span>' + esc((CD.P(b.pid) || {}).name) + ' · by ' + esc(b.by) + '</span><b>' + rs(b.discount) + '</b></div>').join('') : '<div class="mut">None</div>') + '</div></div>';
    const cats = [['Consultations', catSum(bills, 'consult')], ['Procedures', catSum(bills, 'procedure')], ['Medicines', catSum(bills, 'medicine')]];
    const mx = Math.max(1, ...cats.map(x => x[1]));
    const refT = refunds.reduce((x, b) => x + b.refund.amt, 0);
    const where = '<div class="sec">Where the money came from</div><table>' + cats.map(([k, v]) => barRow(k, v, mx)).join('') + (refunds.length ? barRow('Refunds', -refT, mx, refunds.map(b => (CD.P(b.pid) || {}).name + ': ' + b.refund.reason).join(' · ')) : '') + '<tr class="tot"><td>Net</td><td></td><td class="num">' + rs(tot) + '</td></tr></table>';
    const sign = '<div class="g2 avoid"><div class="sigline">Reception (' + esc(cd ? cd.by : CD.meName()) + ') — cash handed over</div><div class="sigline">Owner — cash received</div></div>';
    const list = '<div class="sec" style="break-before:page">Every bill · ' + bills.length + '</div><table><thead><tr><th>Time</th><th>Bill</th><th>Patient</th><th>For</th><th>Mode</th><th class="num">₹</th></tr></thead><tbody>' +
      bills.map(b => { const p = CD.P(b.pid) || {}; return '<tr' + (b.refund ? ' class="strike"' : '') + '><td class="mut" style="white-space:nowrap">' + CD.tShort(b.time) + '</td><td class="mut">' + esc(b.no) + '</td><td>' + esc(p.name || '') + '</td><td>' + esc(b.items.map(i => i.n.replace(' (counter)', '').replace(' (session)', '')).join(' + ')) + '</td><td>' + esc(b.mode) + '</td><td class="num">' + rs(b.total) + '</td></tr>'; }).join('') +
      '<tr class="tot"><td colspan="5">Total after refunds</td><td class="num">' + rs(tot) + '</td></tr></tbody></table>';
    const foot = '<div class="foot"><span>' + esc(c.name) + ' · Day report · Clinic Desk</span><span>' + (c.gstin ? 'GSTIN ' + esc(c.gstin) : '') + '</span></div>';
    return page('A4') + CSS + '<div class="doc" style="--k:#8A6A1F;--t:#FBF5E7">' + head(c, right) + spot + modes + '<div class="g2" style="margin-top:9px">' + cashbook + pts + '</div>' + owe + where + sign + list + foot + '</div>';
  };

  /* ---------------- MONTHLY SUMMARY ---------------- */
  const MON = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  docs.monthly = function (date) {

    let tot = Number(UI.f.coins) || 0; [2000, 500, 200, 100, 50, 20, 10].forEach(n => { tot += (Number(UI.f['n' + n]) || 0) * n; });
    const note = (UI.f.cnote || '').trim(); const was = !!S().dayClosed[C().id];
    return () => (!was && S().dayClosed[C().id]) ? { action: 'v8_close', counted: tot, note } : null;
  };
  P.ptSave = () => { const pt = Object.assign({}, UI.f.pt || {}); return () => Number(pt.amt) > 0 ? { action: 'v8_petty', amt: Number(pt.amt), what: pt.what } : null; };
  P.reopenDay = () => () => ({ action: 'v8_reopen' });
  P.epSave = ds => { const e = Object.assign({}, UI.f.ep || {}); return () => ({ action: 'v8_pinfo', pid: ds.id, p: { name: (e.name || '').trim(), age: e.age, rel: e.rel } }); };
  P.rfDo = ds => { const b = C().bills.find(x => x.no === ds.no); const rf = Object.assign({}, UI.f.rf || {}); return () => (b && b.refund) ? { action: 'v8_refund', day: b.day, k: b.k, amt: Number(rf.amt) || b.total, reason: (rf.why || '').trim() } : null; };
  P.cmDo = ds => { const b = C().bills.find(x => x.no === ds.no); return () => b && { action: 'v8_mode', day: b.day, k: b.k, m: md(ds.v) }; };
  P.setDocStatus = ds => () => ({ action: 'v8_docstatus', status: ds.v });
  /* doctor */
  P.startConsult = ds => {
    const d = CD.doc(S().docId); const v = ds && ds.tok ? vTok(ds.tok) : (CD.inCabin(d.id) || CD.waiting(d.id)[0]);
    return () => v ? { action: 'v8_start', key: v.key } : null;
  };
  P.imBack = () => () => ({ action: 'v8_in' });
  P.imIn = () => () => ({ action: 'v8_in' });
  P.outMore = () => () => ({ action: 'v8_more' });
  P.stepOut = () => { const f = Object.assign({}, UI.f); return () => ({ action: 'v8_out', mins: Number(f.mins) || 30, reason: f.why === "Don't say" ? 'Short break' : f.why }); };
  P.finishRx = () => {
    const nrx = C().rx.length; const tok = UI.prm.tok; const pid = UI.prm.pid; const set = UI.f.set;
    return () => {
      if (C().rx.length === nrx) return null;
      const r = C().rx[C().rx.length - 1]; const v = tok ? vTok(tok) : null;
      if (set) { const st = C().sets.find(x => x.id === set); if (st) send({ action: 'v8_sets', sets: C().sets }); }
      return { action: 'v8_finish', key: v ? v.key : '', pid: r.pid || pid, name: (CD.P(r.pid) || {}).name, rx: { finding: r.finding, meds: r.meds, advice: r.advice, vitals: r.vitals, tests: r.tests, follow: r.follow } };
    };
  };
  P.askCall = ds => () => ({ action: 'v8_askcall', pid: ds.id, name: (CD.P(ds.id) || {}).name });
  P.remindNow = ds => () => ({ action: 'v8_remind', pid: ds.id });
  P.repSeen = ds => () => ({ action: 'v8_rep_seen', id: ds.id });
  P.repReply = ds => () => ({ action: 'v8_rep_seen', id: ds.id, reply: ds.v });
  P.esSave = () => () => ({ action: 'v8_sets', sets: C().sets });
  P.esDel = () => () => ({ action: 'v8_sets', sets: C().sets });
  P.saveAsSet = () => { const n = C().sets.length; return () => C().sets.length !== n ? { action: 'v8_sets', sets: C().sets } : null; };
  P.markLeave = ds => () => ({ action: 'v8_leave', date: ds.v, on: true });
  P.cancelLeave = ds => () => ({ action: 'v8_leave', date: ds.v, on: false });
  P.tmSave = () => { const tm = Object.assign({}, UI.f.tm || {}); return () => tm.to > tm.from ? { action: 'v8_timings', open: iso(tm.from), close: iso(tm.to) } : null; };
  /* owner */
  P.cashOk = ds => () => ({ action: 'v8_cash_ok', date: ds.v });
  P.togglePerm = ds => () => ({ action: 'v8_perm', k: ds.k });
  P.toggleBox = ds => () => ({ action: 'v8_box', k: ds.k });
  P.nsSave = () => { const n = Object.assign({}, UI.f.ns || {}); return () => (n.name || '').trim() ? { action: 'v8_staff', name: n.name.trim(), phone: (n.phone || '').replace(/\D/g, ''), role: /doctor/i.test(n.role) ? 'doctor' : 'reception' } : null; };
  P.refPaid = ds => () => ({ action: 'v8_ref', id: ds.id });
  P.nrSave = () => { const n = Object.assign({}, UI.f.nr || {}); return () => ((n.name || '').trim() && Number(n.amt) > 0) ? { action: 'v8_ref', name: n.name.trim(), what: n.what, amt: Number(n.amt) } : null; };
  P.setColor = ds => () => ({ action: 'v8_cfg', cfg: { color: ds.v } });
  P.setLang = ds => () => ({ action: 'v8_cfg', cfg: { lang: ds.v } });
  P.setRxLang = ds => () => ({ action: 'v8_cfg', cfg: { rxLang: ds.v } });
  let nameT = null;
  P.setName = (ds, el) => { clearTimeout(nameT); const v = el.value; nameT = setTimeout(() => send({ action: 'v8_cfg', cfg: { name: v } }), 900); return null; };
  P.setLogo = (ds, el) => () => el.value ? { action: 'v8_cfg', cfg: { logo: el.value } } : null;
  let docT = null;
  P.docField = () => { clearTimeout(docT); docT = setTimeout(() => { const d = CD.doc(S().docId); send({ action: 'v8_cfg', cfg: { doc: { name: d.name, deg: d.deg, reg: d.reg, council: d.council, spec: d.spec } } }); }, 900); return null; };
  P.esSaveSetting = () => {
    const k = UI.f.esk; const e = JSON.parse(JSON.stringify(UI.f.es || {}));
    return () => {
      if (UI.modal) return null; // the form showed an error
      const c = C();
      if (k === 'fees') return { action: 'v8_cfg', cfg: { fee: Number(e.fee), freeDays: Number(e.free) || 0 } };
      if (k === 'treat') return { action: 'v8_cfg', cfg: { treatments: c.treatments } };
      if (k === 'gst') return { action: 'v8_cfg', cfg: { biz: { gstin: (e.gstin || '').trim(), prefix: (e.pre || '').replace(/\W/g, '') } } };
      if (k === 'timings') return { action: 'v8_cfg', cfg: { timings: e.t } };
      if (k === 'doctors') { const d = c.doctors[0]; return { action: 'v8_cfg', cfg: { doc: { name: d.name, deg: d.deg, reg: d.reg, council: d.council, spec: d.spec } } }; }
      return null;
    };
  };
  P.winBack = () => () => { CD.toast('Bulk messages need an approved WhatsApp template. Ask Alok to switch this on.'); return null; };
  P.merge = () => () => { CD.toast('Merging patients is coming soon on the live desk.'); return null; };
  P.changeDoc = () => () => null;

  CD.livePre = (name, ds, el) => { const f = P[name]; if (!f) return null; try { return f(ds, el); } catch (e) { console.error('livePre ' + name, e); return null; } };
  CD.liveAfter = fn => { let p = null; try { p = fn(); } catch (e) { console.error('liveAfter', e); } if (p) send(p); };

  /* ---------- top bar (replaces the demo bar) ---------- */
  const APPS = { owner: [['owner', 'Owner'], ['doctor', 'Doctor'], ['reception', 'Reception']], doctor: [['doctor', 'Doctor'], ['reception', 'Reception']], reception: [['reception', 'Reception']] };
  CD.allowApp = a => (APPS[L.role] || APPS.reception).some(x => x[0] === a);
  CD.homeApp = () => (APPS[L.role] || APPS.reception)[0][0];
  function dot() { return L.offline ? '<span class="lv-dot off" title="No internet">Offline · will retry</span>' : (L.busy || L.queue.length) ? '<span class="lv-dot busy">Saving…</span>' : '<span class="lv-dot ok">Live</span>'; }
  CD.liveBar = () => {
    const apps = APPS[L.role] || APPS.reception; const me = (S() && S().me) || {};
    return '<div class="demo live no-print" role="navigation"><b>' + esc(C().name) + '</b>' + (apps.length > 1 ? apps.map(([id, l]) => '<button class="pill' + (UI.app === id ? ' on' : '') + '" data-a="app" data-v="' + id + '">' + l + '</button>').join('') : '') +
      '<span class="sp"></span><span id="lv-dot">' + dot() + '</span><span>' + esc(me.name || '') + '</span><button class="pill" data-a="lvRefresh" title="Get the latest">↻</button><button class="pill" data-a="lvMenu">⋯</button></div>';
  };
  function paintBar() { const el = document.getElementById('lv-dot'); if (el) el.innerHTML = dot(); }
  CD.A.lvRefresh = () => refresh(true).then(() => CD.toast('Up to date'));
  CD.A.lvMenu = () => CD.modal('<h2 class="t">' + esc((S().me || {}).name || '') + '</h2><div class="muted">' + esc(C().name) + ' · ' + esc(L.role) + '</div><div class="flex wrap"><a class="ghost" style="text-decoration:none" href="?old=1">Open the old desk</a><button class="ghost" data-a="lvLogout">Log out</button><button class="txt" data-a="close">Close</button></div>');
  CD.A.lvLogout = () => { CD.closeModal(); loggedOut(); };

  /* ---------- login ---------- */
  function loggedOut(msg) { store('cd_sid', null); store('cd_role', null); L.sid = null; CD.liveState = null; drawLogin(msg); }
  let LG = { step: 'phone', ph: '', err: '' };
  function drawLogin(msg) {
    if (msg) LG.err = msg;
    document.body.className = 'app-reception';
    const r = document.getElementById('root');
    const err = LG.err ? '<div class="bad small" style="min-height:4px">' + esc(LG.err) + '</div>' : '';
    let inner;
    if (LG.step === 'code') inner = '<h1 class="t">Enter the code</h1><div class="muted">We sent a 6-digit code on WhatsApp to ' + esc(LG.sentTo || LG.ph) + '.</div><input class="field" id="lg-code" inputmode="numeric" maxlength="6" placeholder="6-digit code" style="font-size:26px;letter-spacing:6px" autofocus>' + err + '<button class="btn big full" id="lg-go">Log in</button><button class="txt" id="lg-back">Use another number</button>';
    else if (LG.step === 'pw') inner = '<h1 class="t">Your password</h1><div class="muted">' + esc(LG.ph) + '</div><input class="field" id="lg-pw" type="password" placeholder="Password" autofocus>' + err + '<button class="btn big full" id="lg-go">Log in</button><button class="txt" id="lg-back">Back</button>';
    else if (LG.step === 'wa') inner = '<h1 class="t">One step on WhatsApp</h1><div class="card pad soft">Open WhatsApp and send <b>LOGIN</b> to the clinic number. You will get a login link. Tap it and you are in.</div>' + err + '<button class="ghost" id="lg-back">Back</button>';
    else inner = '<h1 class="t">Log in to the desk</h1><div class="muted">Use the phone number your clinic added.</div><input class="field" id="lg-ph" inputmode="numeric" maxlength="10" placeholder="10-digit mobile" value="' + esc(LG.ph) + '" style="font-size:24px;letter-spacing:1px" autofocus>' + err + '<button class="btn big full" id="lg-otp">Get code on WhatsApp</button><button class="ghost full" id="lg-pwb">I have a password</button>';
    r.innerHTML = '<div class="app-reception"><main class="pg narrow" style="padding-top:64px"><div class="card pad" style="display:grid;gap:14px">' + inner + '</div><p class="muted small" style="text-align:center">Clinic Desk · bas30din</p></main></div>';
    const $ = id => document.getElementById(id);
    const busy = b => r.querySelectorAll('button').forEach(x => { x.disabled = b; });
    const phOk = () => { const p = ($('lg-ph') ? $('lg-ph').value : LG.ph).replace(/\D/g, ''); if (p.length !== 10) { LG.err = 'Enter your 10-digit mobile number.'; drawLogin(); return null; } LG.ph = p; return p; };
    if ($('lg-otp')) $('lg-otp').onclick = () => { const p = phOk(); if (!p) return; busy(true); post({ action: 'otp_send', phone: p }).then(x => { LG.err = ''; if (!x.ok) { LG.err = x.error || 'Could not send the code.'; } else if (x.viaWa) LG.step = 'wa'; else { LG.step = 'code'; LG.sentTo = x.sentTo; } drawLogin(); }).catch(() => { LG.err = 'No internet. Try again.'; drawLogin(); }); };
    if ($('lg-pwb')) $('lg-pwb').onclick = () => { const p = phOk(); if (!p) return; LG.step = 'pw'; LG.err = ''; drawLogin(); };
    if ($('lg-back')) $('lg-back').onclick = () => { LG.step = 'phone'; LG.err = ''; drawLogin(); };
    const done = x => { if (!x.ok) { LG.err = x.error || 'Could not log in.'; drawLogin(); return; } store('cd_sid', x.sid); store('cd_role', x.role); L.sid = x.sid; L.role = x.role; LG = { step: 'phone', ph: '', err: '' }; boot(); };
    if ($('lg-go')) $('lg-go').onclick = () => {
      busy(true);
      const q = LG.step === 'code' ? { action: 'otp_verify', phone: LG.ph, code: ($('lg-code').value || '').replace(/\D/g, '') } : { action: 'pw_login', phone: LG.ph, pw: $('lg-pw').value };
      post(q).then(done).catch(() => { LG.err = 'No internet. Try again.'; drawLogin(); });
    };
    const inp = r.querySelector('input'); if (inp) { inp.addEventListener('keydown', e => { if (e.key === 'Enter') { const b = $('lg-go') || $('lg-otp'); if (b) b.click(); } }); setTimeout(() => inp.focus(), 0); }
  }

  /* ---------- start ---------- */
  function boot() {
    document.getElementById('root').innerHTML = '<div class="pg narrow" style="padding-top:120px;text-align:center" class="muted">Opening the desk…</div>';
    post({ sid: L.sid, v8: true }).then(r => {
      if (r && r.auth) return loggedOut(r.error);
      if (!r.v8) { document.getElementById('root').innerHTML = '<main class="pg narrow" style="padding-top:80px"><div class="card pad bad">The desk could not load. ' + esc(r.v8err ? 'Error on the server.' : (r.error || '')) + '</div><a href="?old=1">Open the old desk</a></main>'; return; }
      L.role = (r.v8.me && r.v8.me.role) || L.role; store('cd_role', L.role);
      CD.send = () => {}; CD.tick = () => {};
      apply(r.v8);
      if (!CD.allowApp(UI.app) || !location.hash) { UI.app = CD.homeApp(); UI.scr = 'home'; }
      CD.start();
      setInterval(() => { if (!document.hidden) refresh(false); }, 7000);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(false); });
      window.addEventListener('online', () => { L.offline = false; pump(); refresh(false); });
    }).catch(() => { document.getElementById('root').innerHTML = '<main class="pg narrow" style="padding-top:80px"><div class="card pad">No internet. <button class="btn" onclick="location.reload()">Try again</button></div></main>'; });
  }
  CD.liveBoot = function () {
    const qs = new URLSearchParams(location.search);
    const code = qs.get('code');
    if (code) {
      history.replaceState(null, '', location.pathname);
      post({ action: 'login', code }).then(x => { if (!x.ok) return drawLogin(x.error || 'This login link has expired.'); store('cd_sid', x.sid); store('cd_role', x.role); L.sid = x.sid; L.role = x.role; boot(); }).catch(() => drawLogin('No internet. Try again.'));
      return;
    }
    if (L.sid) boot(); else drawLogin();
  };
})();
</script>
</body>
</html>
