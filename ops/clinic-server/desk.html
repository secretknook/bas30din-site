<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="robots" content="noindex">
<title>Clinic Desk</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#F2F4F7;color:#101828;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
a{color:#175CD3}
.wrap{max-width:520px;margin:0 auto;min-height:100vh;background:#F2F4F7;display:flex;flex-direction:column;position:relative}
.white{background:#FFFFFF}
.top{background:#FFF;padding:calc(env(safe-area-inset-top) + 16px) 16px 12px;border-bottom:1px solid #EAECF0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.h1{font-size:22px;font-weight:700;letter-spacing:-.2px}
.sub{font-size:13px;color:#667085}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;border-radius:16px;padding:6px 10px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.card{background:#FFF;border:1px solid #EAECF0;border-radius:14px}
.sec{padding:14px 16px 6px;font-size:13px;font-weight:600;color:#475467;display:flex;justify-content:space-between}
.row{display:flex;align-items:center;gap:12px;padding:11px 12px;border-bottom:1px solid #F2F4F7}
.row:last-child{border-bottom:none}
.btn{height:48px;border-radius:12px;border:1px solid #D0D5DD;background:#FFF;font-size:15px;font-weight:600;color:#344054;padding:0 14px}
.btn.pri{background:#175CD3;border-color:#175CD3;color:#FFF}
.btn.big{height:60px;font-size:17px;font-weight:700;width:100%}
.btn.sm{height:36px;font-size:13px;border-radius:8px;padding:0 12px}
.btn:disabled{opacity:.45;cursor:default}
.content{flex:1;padding-bottom:96px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#FFF;border-top:1px solid #EAECF0;padding:8px 0 calc(env(safe-area-inset-bottom) + 10px)}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid}
nav.tabs button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:500;color:#667085;position:relative;padding:4px 0}
nav.tabs button.on{color:#175CD3;font-weight:600}
.badge{position:absolute;top:-2px;left:55%;min-width:18px;height:18px;border-radius:9px;background:#D92D20;color:#FFF;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 4px}
.toast{margin:10px 12px 0;padding:10px 12px;border-radius:12px;background:#101828;color:#FFF;font-size:13px;line-height:1.45}
.sheet-bg{position:fixed;inset:0;background:rgba(16,24,40,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:#FFF;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom) + 24px);display:flex;flex-direction:column;gap:12px}
.grab{align-self:center;width:36px;height:4px;border-radius:2px;background:#D0D5DD}
input.f{height:48px;border:1px solid #D0D5DD;border-radius:10px;padding:0 12px;font-size:16px;font-family:inherit;width:100%}
.seg{display:grid;background:#F2F4F7;border-radius:10px;padding:3px}
.seg button{height:34px;border:none;border-radius:8px;font-size:13px;font-weight:600;background:transparent;color:#667085}
.seg button.on{background:#FFF;color:#101828;box-shadow:0 1px 2px rgba(16,24,40,.1)}
.empty{padding:28px 16px;text-align:center;color:#667085;font-size:14px}
.tok{font-variant-numeric:tabular-nums}
.fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:96px;height:52px;padding:0 18px;border-radius:16px;border:none;background:#101828;color:#FFF;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;box-shadow:0 6px 16px rgba(16,24,40,.25);z-index:5}
.bub{max-width:80%;padding:8px 12px;border-radius:14px;font-size:15px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
.err{margin:12px;padding:12px;border-radius:12px;background:#FEF3F2;color:#B42318;font-size:14px}
</style>
</head>
<body>
<div id="app"></div>

      return '<div class="top"><button class="btn sm" data-back="1" style="border:none;color:#175CD3;padding:0">‹ Inbox</button><div style="flex:1;min-width:0"><div style="font-size:16px;font-weight:600">' + esc(c.name) + '</div><div class="sub">' + (c.open ? 'Live chat · ' : 'Chat ended · ') + esc(c.shown) + '</div></div>' + (c.open ? '<button class="btn sm" data-end="' + esc(c.phone) + '" style="color:#D92D20;border:none">End</button>' : '') + '</div>' +
        '<div style="padding:12px;display:flex;flex-direction:column;gap:6px">' + (msgs || '<div class="empty">No messages yet.</div>') + '</div>' +
        (c.open ? '<div style="position:fixed;bottom:84px;left:0;right:0"><div style="max-width:520px;margin:0 auto;padding:8px 12px;background:#FFF;border-top:1px solid #EAECF0;display:flex;gap:8px"><input class="f" id="msg" placeholder="Message" style="border-radius:24px"><button class="btn pri" id="send" style="border-radius:24px">Send</button></div></div>' : '');
    }
    function vDoctor(d) {
      var q = d.queue, now = q.now, dk = DOC[d.doc.status] ? d.doc.status : 'in';
      var btns = ['in', 'late', 'away', 'leave'].map(function (k) { var on = k === dk; return '<button data-status="' + k + '" style="height:64px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:' + (on ? '1.5px solid ' + DOC[k][1] : '1px solid #EAECF0') + ';background:' + (on ? DOC[k][2] : '#FFF') + ';color:' + (on ? DOC[k][3] : '#344054') + '"><span class="dot" style="width:10px;height:10px;background:' + DOC[k][1] + '"></span><span style="font-size:12.5px;font-weight:600">' + DOC[k][0] + '</span></button>'; }).join('');
      var line = dk === 'in' ? 'In clinic' : dk === 'late' ? 'Running ' + d.doc.mins + ' min late' : dk === 'away' ? 'Away' + (d.doc.until ? ', back ~' + d.doc.until : '') : 'On leave';
      var a = S.appts || [];
      var rest = a.map(function (x) { return '<div class="row" style="padding:10px 0"><span class="tok" style="width:70px;flex-shrink:0;font-size:14px;font-weight:600">' + esc(x.time) + '</span><span style="flex:1;min-width:0"><div style="font-size:15px;font-weight:600">' + esc(x.name) + (x.isNew ? '<span style="color:#175CD3;font-size:12px;font-weight:500">  New</span>' : '<span class="sub" style="font-size:12px">  visit ' + x.visits + '</span>') + '</div><div class="sub">' + esc(x.treat) + '</div></span></div>'; }).join('');
      return '<div><div style="padding:calc(env(safe-area-inset-top) + 18px) 16px 0"><div class="sub">' + new Date().toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' }) + '</div><div style="font-size:24px;font-weight:700;letter-spacing:-.3px">' + esc(d.clinic.doctor) + '</div></div>' +
        '<div style="margin:16px 16px 0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px">' + btns + '</div><div class="sub" style="margin:8px 16px 0">✓ ' + esc(line) + ' · shown to reception and patients' + (d.doc.setAt ? ' · updated ' + esc(d.doc.setAt) : '') + '</div>' +
        '<div class="card" style="margin:16px 16px 0;padding:14px;display:flex;flex-direction:column;gap:10px"><div style="display:flex;justify-content:space-between"><span style="font-size:12px;font-weight:700;letter-spacing:.6px;color:#175CD3">WITH YOU NOW' + (now ? ' · TOKEN ' + esc(now.tok) : '') + '</span><span class="sub">' + q.waiting.length + ' waiting</span></div><div style="font-size:20px;font-weight:700">' + esc(now ? now.name : 'Nobody yet') + '</div>' +
        '<button class="btn pri" data-a="call_next"' + (!q.waiting.length && !now ? ' disabled' : '') + '>Call next</button></div>' +
        '<div class="sec" style="padding:18px 16px 6px"><span style="font-size:15px;color:#101828;font-weight:700">Appointments today</span><span>' + a.length + '</span></div><div style="padding:0 16px 16px">' + (rest || '<div class="empty">No appointments today.</div>') + '</div></div>';
    }
    function vMore(d) {
      var poster = location.origin + location.pathname + '?v=qr&n=' + encodeURIComponent(d.clinic.botNumber) + '&c=' + encodeURIComponent(d.clinic.name);
      return '<div class="top"><div><div class="h1">More</div><div class="sub">' + esc(d.me.name) + ' · ' + esc(d.me.role) + '</div></div></div>' +
        '<div class="card" style="margin:12px;overflow:hidden">' +
        '<a class="row" style="text-decoration:none;color:#101828" href="' + esc(poster) + '" target="_blank"><span style="flex:1"><b>QR poster for reception</b><div class="sub">Print it and keep it at the desk</div></span>›</a>' +
        (d.links.tv ? '<a class="row" style="text-decoration:none;color:#101828" href="' + esc(d.links.tv) + '" target="_blank"><span style="flex:1"><b>Waiting-room TV screen</b><div class="sub">Open this link on the TV or any old phone</div></span>›</a>' : '') +
        '<button class="row" data-logout="1" style="width:100%;border:none;background:#FFF;text-align:left;color:#B42318;font-weight:600;font-size:15px">Log out</button></div>';
    }
    function sheet() {
      if (S.sheet === 'token') return '<div class="sheet-bg" data-close="1"><div class="sheet" onclick="event.stopPropagation()"><span class="grab"></span><b style="font-size:19px">Give a token</b><input class="f" id="tn" placeholder="Patient name"><input class="f" id="tp" inputmode="tel" placeholder="WhatsApp number (optional)"><div class="sub">With a number, the patient gets the token and live status on WhatsApp.</div><button class="btn pri" id="tadd">Give token</button><button class="btn" data-close="1" style="border:none">Cancel</button></div></div>';
      if (S.sheet === 'late' || S.sheet === 'away') {
        var opts = [15, 30, 45, 60].map(function (m) { return '<button class="btn" data-mins="' + m + '" style="' + (S.mins === m ? 'border:2px solid #175CD3;background:#EFF4FF;color:#175CD3' : '') + '">' + (m === 60 ? '1 hour' : m + ' min') + '</button>'; }).join('');
        return '<div class="sheet-bg" data-close="1"><div class="sheet" onclick="event.stopPropagation()"><span class="grab"></span><b style="font-size:19px">' + (S.sheet === 'late' ? 'How late are you running?' : 'Back in about…') + '</b><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">' + opts + '</div><div class="card" style="padding:12px;font-size:14px;line-height:1.7;color:#344054">✓ Reception app updates<br>✓ Bot answers "Doctor aa gaye?"<br>✓ Waiting patients and the next 2 hours of bookings get a WhatsApp</div><button class="btn pri" id="dstat">Update everywhere</button><button class="btn" data-close="1" style="border:none">Cancel</button></div></div>';
      }
      return '';
    }
    function draw() {
      if (!S.sid) return drawLogin();
      var d = S.data;
      if (!d) { $app.innerHTML = '<div class="wrap"><div class="empty">Loading…</div></div>'; return; }
      var tabs = tabsFor(d.me.role); if (tabs.indexOf(S.tab) < 0) S.tab = tabs[0];
      var body = S.tab === 'queue' ? vQueue(d) : S.tab === 'today' ? vToday() : S.tab === 'inbox' ? vInbox(d) : S.tab === 'doctor' ? vDoctor(d) : vMore(d);
      var inboxN = d.inbox ? d.inbox.live.length + d.inbox.callbacks.length : 0;
      var nav = '<nav class="tabs"><div class="in" style="grid-template-columns:repeat(' + tabs.length + ',1fr)">' + tabs.map(function (t) { return '<button data-tab="' + t + '" class="' + (S.tab === t ? 'on' : '') + '"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">' + ICON[t] + '</svg>' + LAB[t] + (t === 'inbox' && inboxN ? '<span class="badge">' + inboxN + '</span>' : '') + '</button>'; }).join('') + '</div></nav>';
      var keepMsg = document.getElementById('msg'); var draft = keepMsg ? keepMsg.value : '';
      $app.innerHTML = '<div class="wrap' + (S.tab === 'doctor' ? ' white' : '') + '">' + (S.err ? '<div class="err">' + esc(S.err) + '</div>' : '') + '<div class="content">' + body + '</div>' + nav + sheet() + '</div>';
      var m2 = document.getElementById('msg'); if (m2 && draft) { m2.value = draft; }
      bind();
    }
    function bind() {
      $app.querySelectorAll('[data-tab]').forEach(function (b) { b.onclick = function () { S.tab = b.dataset.tab; S.chat = null; draw(); if (S.tab === 'today' || S.tab === 'doctor') { S.apptsAt = 0; poll(); } }; });
      $app.querySelectorAll('[data-a]').forEach(function (b) { b.onclick = function () { var a = b.dataset.a; act(a, {}, function (r) { return r.sent ? 'WhatsApp sent to ' + r.sent + ' patient' + (r.sent > 1 ? 's' : '') + '.' : (a === 'call_next' ? 'Queue moved.' : 'Moved 2 places back.'); }); }; });
      $app.querySelectorAll('[data-sheet]').forEach(function (b) { b.onclick = function () { S.sheet = b.dataset.sheet; draw(); var i = document.getElementById('tn'); if (i) i.focus(); }; });
      $app.querySelectorAll('[data-close]').forEach(function (b) { b.onclick = function (e) { if (e.target === b) { S.sheet = null; draw(); } }; });
      $app.querySelectorAll('[data-seg]').forEach(function (b) { b.onclick = function () { S.seg = b.dataset.seg; draw(); }; });
      $app.querySelectorAll('[data-chat]').forEach(function (b) { b.onclick = function () { S.chat = b.dataset.chat; poll(); }; });
      $app.querySelectorAll('[data-back]').forEach(function (b) { b.onclick = function () { S.chat = null; draw(); }; });
      $app.querySelectorAll('[data-end]').forEach(function (b) { b.onclick = function () { if (confirm('End this live chat?')) act('chat_end', { phone: b.dataset.end }); }; });
      $app.querySelectorAll('[data-cb]').forEach(function (b) { b.onclick = function () { act('cb_done', { phone: b.dataset.cb }); }; });
      $app.querySelectorAll('[data-logout]').forEach(function (b) { b.onclick = logout; });
      $app.querySelectorAll('[data-status]').forEach(function (b) { b.onclick = function () { var k = b.dataset.status; if (k === 'late' || k === 'away') { S.sheet = k; S.mins = 30; draw(); } else if (confirm(k === 'leave' ? 'Mark yourself on leave today? Waiting patients will be told.' : 'Back in clinic? Patients who were told will get an update.')) act('set_status', { status: k, needAppts: true }, function (r) { return r.told ? r.told + ' patients updated on WhatsApp.' : 'Status updated.'; }); }; });
      $app.querySelectorAll('[data-mins]').forEach(function (b) { b.onclick = function () { S.mins = Number(b.dataset.mins); draw(); }; });
      var ds = document.getElementById('dstat'); if (ds) ds.onclick = function () { var k = S.sheet; S.sheet = null; act('set_status', { status: k, mins: S.mins, needAppts: true }, function (r) { return r.told ? r.told + ' patients told on WhatsApp.' : 'Status updated. No patients needed a message.'; }); };
      var ta = document.getElementById('tadd'); if (ta) ta.onclick = function () { var n = document.getElementById('tn').value.trim(), p = document.getElementById('tp').value.trim(); if (!n) return document.getElementById('tn').focus(); S.sheet = null; act('add_token', { name: n, phone: p }, function (r) { return 'Token ' + (r.added || '') + ' given to ' + n + (p ? '. Sent on WhatsApp if their chat is open.' : '.'); }); };
      var sd = document.getElementById('send'); if (sd) { var go = function () { var i = document.getElementById('msg'); var t = i.value.trim(); if (!t) return; i.value = ''; act('chat_send', { phone: S.chat, text: t }); }; sd.onclick = go; document.getElementById('msg').onkeydown = function (e) { if (e.key === 'Enter') go(); }; }
    }
    var code = qs.get('code');
    if (code) {
      history.replaceState(null, '', location.pathname);
      $app.innerHTML = '<div class="wrap white"><div class="empty">Logging you in…</div></div>';
      post({ action: 'login', code: code }).then(function (r) {
        if (!r.ok) return drawLogin(r.error || 'Login link not valid.');
        store('cd_sid', r.sid); store('cd_role', r.role); if (r.clinic && r.clinic.botNumber) store('cd_bot', r.clinic.botNumber);
        S.sid = r.sid; S.role = r.role; poll();
      }).catch(function () { drawLogin('Could not reach the server. Try again.'); });
    } else if (S.sid) { draw(); poll(); } else drawLogin();
    setInterval(poll, 8000);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) poll(); });
  }

  var v = qs.get('v');
  if (v === 't') tracker(qs.get('k'));
  else if (v === 'tv') tv(qs.get('k'));
  else if (v === 'qr') poster();
  else staff();
})();
</script>
</body>
</html>
